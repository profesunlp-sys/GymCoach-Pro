<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GymCoach Pro - Setup Wizard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#277bf1",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- iOS Frame / Container -->
<div class="w-full max-w-[430px] h-[932px] bg-white dark:bg-slate-900 shadow-2xl overflow-hidden flex flex-col relative rounded-[3rem] border-[8px] border-slate-900 dark:border-slate-800">
<!-- iOS Status Bar (Visual Only) -->
<div class="h-11 w-full flex justify-between items-center px-8 shrink-0">
<span class="text-xs font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons-outlined text-[14px]">signal_cellular_alt</span>
<span class="material-icons-outlined text-[14px]">wifi</span>
<span class="material-icons-outlined text-[14px] rotate-90">battery_full</span>
</div>
</div>
<!-- Header -->
<header class="px-6 py-4 flex items-center justify-between">
<div class="w-10"></div> <!-- Spacer for centering -->
<h1 class="text-lg font-semibold text-slate-800 dark:text-white">Registrar Clase</h1>
<button class="w-10 h-10 flex items-center justify-end text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
<span class="material-icons-outlined">close</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 overflow-y-auto pb-32">
<!-- Step Indicator -->
<div class="mt-2 mb-8">
<p class="text-sm font-medium text-slate-500 dark:text-slate-400">Paso 1 de 6</p>
<div class="w-full h-1 bg-slate-100 dark:bg-slate-800 rounded-full mt-2">
<div class="bg-primary h-full w-1/6 rounded-full"></div>
</div>
</div>
<!-- Form Fields -->
<div class="space-y-8">
<!-- Date Picker -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Fecha</label>
<div class="relative">
<span class="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">calendar_today</span>
<input class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-4 pl-12 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all" readonly="" type="text" value="12 Octubre, 2023"/>
</div>
</div>
<!-- Group Selection -->
<div class="space-y-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Nombre de Grupo</label>
<div class="flex gap-2">
<div class="relative flex-1">
<select class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-4 px-4 appearance-none text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all">
<option>Seleccionar grupo</option>
<option>Nivel Inicial A</option>
<option>Avanzado Juvenil</option>
<option>Elite Varonil</option>
</select>
<span class="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
</div>
<button class="bg-primary hover:bg-primary/90 text-white w-[58px] rounded-xl flex items-center justify-center transition-colors">
<span class="material-icons-outlined">add</span>
</button>
</div>
</div>
<!-- Teacher Selection -->
<div class="space-y-4">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Profesor a Cargo</label>
<div class="flex flex-wrap gap-3">
<!-- Active Chip -->
<button class="flex items-center gap-2 bg-primary text-white px-4 py-2.5 rounded-full shadow-lg shadow-primary/20 transition-all border border-primary">
<div class="w-6 h-6 rounded-full overflow-hidden bg-white/20">
<img class="w-full h-full object-cover" data-alt="Portrait of a male gymnastics coach" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDAscrzsKkOqHNsMi9DLgo5tyHfk_ads3rwSQzzaFr-47BEt0CDA5pMi3OQZscKZL-NSSkCVKqXeAGWoa15QBcLxtCv5He2bX4DgpUHLz0UClK5_aOpUkPNTEK4yTDaDS9eOTfh1ZbfXhov9RucyrIOwPyxqkldbJBZ_Ad3-jsXDwwvllOvr1rrnlV0XrSpGhvyAvFU0Ox-saSz_e3U6DmJ4X9Y9MugLNHCCGPgr-e5q_gIUYs4LdPkio7vQCe8WlHdLAs3Y7v20BpS"/>
</div>
<span class="text-sm font-medium">Carlos R.</span>
</button>
<!-- Inactive Chip -->
<button class="flex items-center gap-2 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 hover:border-primary/50 transition-all">
<div class="w-6 h-6 rounded-full overflow-hidden bg-slate-200 dark:bg-slate-700">
<img class="w-full h-full object-cover opacity-80" data-alt="Portrait of a female gymnastics coach" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAi4ZS9xuHptsoHSQYVwRwJvuBsVZf6y2UOl5C-Lv-xr--ACfvD3O-_aZ1XA-56i99kVAvcMkz3cbaQZaB4nLdef30DSZroRemIAKobwHWtyE8dkLzCukOR80Ha4hPO4VD0amFbIb1RgiezasMQdTxkaWE2_QCkUDmdC0Nl61V-tYZ6Nu3pkhAbpmjFYswwHID6atnXYgnMTPRB5gKvo7hBxf3huLmQULBnVDsAz14fMPcaNEI-0jd-ovJVnu6U0qVYKfdzcXYvE3N_"/>
</div>
<span class="text-sm font-medium">Marta S.</span>
</button>
<!-- Inactive Chip -->
<button class="flex items-center gap-2 bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 px-4 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 hover:border-primary/50 transition-all">
<div class="w-6 h-6 rounded-full overflow-hidden bg-slate-200 dark:bg-slate-700">
<img class="w-full h-full object-cover opacity-80" data-alt="Portrait of a young male gym instructor" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAdgIFnbwIZoGG0JeXmi19vuhH5EziFVItgdCeMWApHhG05MZkFrHroBwyKMVISfhxyqxy7dsGxdoCRNvk_zYljns-AKihoGb7dEfMHI3sHBj6-AxuXw3bJYxF3s_XFvFmoSAsZDW9esbLfit1EcyvIw22xLlRmaXOBkmvNqhelYFhqVJI2Ki-9IQOMMRTmD2nK-BkCEdvliDsbzP4Uu4yVm9dBrv1k2O_nBN_HTcxib6KiBb-9EJqPD4BqLffqzJQw1sq9phZ5M7U6"/>
</div>
<span class="text-sm font-medium">Jorge T.</span>
</button>
<!-- Add Coach Button -->
<button class="flex items-center justify-center w-11 h-11 rounded-full border-2 border-dashed border-slate-300 dark:border-slate-600 text-slate-400 hover:text-primary hover:border-primary transition-all">
<span class="material-icons-outlined text-xl">add</span>
</button>
</div>
</div>
</div>
</main>
<!-- Sticky Bottom CTA -->
<div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-white via-white to-transparent dark:from-slate-900 dark:via-slate-900 pb-12">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl shadow-xl shadow-primary/30 transition-all flex items-center justify-center gap-2 group">
                Continuar
                <span class="material-icons-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Home Indicator (iOS Visual) -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</body></html>
