                const load = async () => {
                    if ((await db.coaches.count()) === 0) await db.coaches.bulkAdd([{ name: 'Profe Juan' }]);
                    if ((await db.groups.count()) === 0) await db.groups.bulkAdd([{ name: 'Escuelita' }, { name: 'Avanzado' }]);
                    setCoaches(await db.coaches.toArray());
                    setGroups(await db.groups.toArray());
                };
                load();
            }, []);

            const addGroup = async () => {
                const n = prompt("Nombre del grupo:");
                if (n) {
                    await db.groups.add({ name: n });
                    setGroups(await db.groups.toArray());
                    updateData({ groupName: n });
                }
            };

            const addCoach = async () => {
                const n = prompt("Nombre del profe:");
                if (n) {
                    await db.coaches.add({ name: n });
                    setCoaches(await db.coaches.toArray());
                    updateData({ coachName: n });
                }
            };

            return (
                <div className="w-full max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 flex flex-col relative shadow-2xl">
                    {/* Header */}
                    <header className="px-6 py-4 flex items-center justify-between">
                        <div className="w-10"></div>
                        <h1 className="text-lg font-semibold text-slate-800 dark:text-white">Registrar Clase</h1>
                        <button onClick={onCancel} className="w-10 h-10 flex items-center justify-end text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <span className="material-icons-outlined">close</span>
                        </button>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 px-6 overflow-y-auto pb-32">
                        {/* Step Indicator */}
                        <div className="mt-2 mb-8">
                            <p className="text-sm font-medium text-slate-500 dark:text-slate-400">Paso 1 de 6</p>
                            <div className="w-full h-1 bg-slate-100 dark:bg-slate-800 rounded-full mt-2">
                                <div className="bg-primary h-full w-1/6 rounded-full"></div>
                            </div>
                        </div>

                        {/* Form Fields */}
                        <div className="space-y-8">
                            {/* Date Picker */}
                            <div className="space-y-2">
                                <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Fecha</label>
                                <div className="relative">
                                    <span className="material-icons-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">calendar_today</span>
                                    <input
                                        type="date"
                                        value={data.date}
                                        onChange={e => updateData({ date: e.target.value })}
                                        className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-4 pl-12 pr-4 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                                    />
                                </div>
                            </div>

                            {/* Group Selection */}
                            <div className="space-y-2">
                                <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Nombre de Grupo</label>
                                <div className="flex gap-2">
                                    <div className="relative flex-1">
                                        <select
                                            value={data.groupName}
                                            onChange={e => updateData({ groupName: e.target.value })}
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-4 px-4 appearance-none text-slate-900 dark:text-white focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                                        >
                                            <option value="">Seleccionar grupo</option>
                                            {groups.map(g => <option key={g.id} value={g.name}>{g.name}</option>)}
                                        </select>
                                        <span className="material-icons-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                                    </div>
                                    <button onClick={addGroup} className="bg-primary hover:bg-primary/90 text-white w-[58px] rounded-xl flex items-center justify-center transition-colors">
                                        <span className="material-icons-outlined">add</span>
                                    </button>
                                </div>
                            </div>

                            {/* Day Selection Strip */}
                            <div className="space-y-4">
                                <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Días de Actividad</label>
                                <div className="flex justify-between items-center gap-2">
                                    {['L', 'M', 'M', 'J', 'V', 'S'].map((day, idx) => {
                                        const dayId = `${day}-${idx}`;
                                        const isSelected = (data.selectedDays || []).includes(dayId);
                                        return (
                                            <button
                                                key={dayId}
                                                onClick={() => {
                                                    const current = data.selectedDays || [];
                                                    const next = current.includes(dayId) ? current.filter(d => d !== dayId) : [...current, dayId];
                                                    updateData({ selectedDays: next });
                                                }}
                                                className={`w-11 h-11 rounded-full flex items-center justify-center font-bold transition-all border-2 ${isSelected ? 'bg-primary text-white border-primary shadow-lg shadow-primary/20' : 'bg-white dark:bg-slate-800 text-slate-400 dark:text-slate-500 border-slate-100 dark:border-slate-700 hover:border-primary/50'}`}
                                            >
                                                {day}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* Time Selectors */}
                            <div className="grid grid-cols-2 gap-4">
                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Comienza</label>
                                    <div className="relative">
                                        <select
                                            value={data.startTime}
                                            onChange={e => updateData({ startTime: e.target.value })}
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-4 px-4 appearance-none text-slate-900 dark:text-white font-bold focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                                        >
                                            {['17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00'].map(t => (
                                                <option key={t} value={t}>{t}</option>
                                            ))}
                                        </select>
                                        <span className="material-icons absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                                    </div>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest ml-1">Finaliza</label>
                                    <div className="relative">
                                        <select
                                            value={data.endTime}
                                            onChange={e => updateData({ endTime: e.target.value })}
                                            className="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-4 px-4 appearance-none text-slate-900 dark:text-white font-bold focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all"
                                        >
                                            {['18:30', '19:00', '19:30', '20:00'].map(t => (
                                                <option key={t} value={t}>{t}</option>
                                            ))}
                                        </select>
                                        <span className="material-icons absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">expand_more</span>
                                    </div>
                                </div>
                            </div>

                            {/* Teacher Selection */}
                            <div className="space-y-4">
                                <label className="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Profesor a Cargo</label>
                                <div className="flex flex-wrap gap-3">
                                    {coaches.map(c => (
                                        <button
                                            key={c.id}
                                            onClick={() => updateData({ coachName: c.name })}
                                            className={`flex items-center gap-2 px-4 py-2.5 rounded-full border transition-all ${data.coachName === c.name ? 'bg-primary text-white border-primary shadow-lg shadow-primary/20' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:border-primary/50'}`}
                                        >
                                            <div className={`w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold ${data.coachName === c.name ? 'bg-white/20' : 'bg-slate-200 dark:bg-slate-700'}`}>
                                                {c.name.charAt(0)}
                                            </div>
                                            <span className="text-sm font-medium">{c.name}</span>
                                        </button>
                                    ))}
                                    <button onClick={addCoach} className="flex items-center justify-center w-11 h-11 rounded-full border-2 border-dashed border-slate-300 dark:border-slate-600 text-slate-400 hover:text-primary hover:border-primary transition-all">
                                        <span className="material-icons-outlined text-xl">add</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* Sticky Bottom CTA */}
                    <div className="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-white via-white to-transparent dark:from-slate-900 dark:via-slate-900 pb-12">
                        <button
                            onClick={onNext}
                            disabled={!data.groupName || !data.date}
                            className="w-full bg-primary hover:bg-primary/90 text-white font-semibold py-4 rounded-xl shadow-xl shadow-primary/30 transition-all flex items-center justify-center gap-2 group disabled:opacity-50"
                        >
                            Continuar
                            <span className="material-icons-outlined text-[20px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
                        </button>
                    </div>

                    {/* Home Indicator (iOS Visual) */}
                    <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
                </div>
            )
        };

        // Step 2: Attendance
        const Step2Attendance = ({ data, updateData, onNext, onBack }) => {
            const [students, setStudents] = useState([]);

            useEffect(() => {
                db.students.toArray().then(setStudents);
            }, []);

            const toggle = (id) => {
                const s = new Set(data.attendance);
                if (s.has(id)) s.delete(id); else s.add(id);
                updateData({ attendance: Array.from(s) });
            };

            const handleAdd = async () => {
                const name = prompt("Nombre del alumno nuevo:");
                if (name) {
                    const dob = new Date().toISOString();
                    const category = 'N/A';
                    const id = await db.students.add({ name, dob, category, active: 1 });
                    setStudents(prev => [...prev, { id, name, dob, category, active: 1 }]);
                    toggle(id);
                }
            };

            const presentCount = (data.attendance || []).length;

            return (
                <div className="w-full max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 flex flex-col relative shadow-2xl overflow-hidden">
                    {/* Header */}
                    <header className="px-6 py-4 flex items-center justify-between shrink-0">
                        <button onClick={onBack} className="w-10 h-10 flex items-center justify-start text-slate-800 dark:text-white">
                            <span className="material-icons">arrow_back_ios</span>
                        </button>
                        <h1 className="text-xl font-bold text-slate-900 dark:text-white">Asistencia</h1>
                        <div className="w-10"></div>
                    </header>

                    {/* Progress & Summary */}
                    <footer className="p-8 text-center">
                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">GymCoach Pro v2.0 • PWA Ready</p>
                    </footer>
                    <div className="px-6 mb-2 shrink-0">
                        <p className="text-sm text-slate-500 font-medium mb-4">Paso 2 de 6</p>
                        <div className="bg-primary/10 dark:bg-primary/20 rounded-xl p-5 flex items-center justify-between border border-primary/20 transition-all">
                            <div>
                                <h2 className="text-2xl font-bold text-primary">{presentCount} Presentes</h2>
                                <p className="text-xs text-primary/70 font-medium uppercase tracking-wider mt-0.5">De {students.length} alumnos inscritos</p>
                            </div>
                            <div className="bg-primary p-2 rounded-lg">
                                <span className="material-icons text-white">checklist</span>
                            </div>
                        </div>
                    </div>

                    {/* Student List */}
                    <div className="flex-1 overflow-y-auto hide-scrollbar px-6 py-4 space-y-3 pb-32">
                        {students.map(s => (
                            <div key={s.id} className="flex items-center justify-between p-4 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-100 dark:border-slate-700 transition-all hover:border-primary/30">
                                <div className="flex items-center gap-3">
                                    <div className="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold overflow-hidden">
                                        {s.name.charAt(0)}
                                    </div>
                                    <div>
                                        <h3 className="font-semibold text-slate-900 dark:text-white">{s.name}</h3>
                                        <p className="text-xs text-slate-500">{s.category}</p>
                                    </div>
                                </div>
                                <div className="relative inline-block w-12 h-6 align-middle select-none">
                                    <input
                                        type="checkbox"
                                        id={`toggle-${s.id}`}
                                        checked={(data.attendance || []).includes(s.id)}
                                        onChange={() => toggle(s.id)}
                                        className="sr-only peer"
                                    />
                                    <label
                                        htmlFor={`toggle-${s.id}`}
                                        className="block h-6 rounded-full bg-slate-300 dark:bg-slate-700 cursor-pointer transition-colors peer-checked:bg-primary after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:w-5 after:h-5 after:rounded-full after:shadow-md after:transition-transform peer-checked:after:translate-x-6"
                                    ></label>
                                </div>
                            </div>
                        ))}

                        {/* Add New Student Button */}
                        <button onClick={handleAdd} className="w-full py-4 flex items-center justify-center gap-2 border-2 border-dashed border-primary/30 text-primary font-semibold rounded-xl mt-4 hover:bg-primary/5 transition-colors">
                            <span className="material-icons" style={{ fontSize: '20px' }}>person_add</span>
                            <span>Agregar Alumno Nuevo</span>
                        </button>
                    </div>

                    {/* Footer Nav */}
                    <div className="absolute bottom-0 left-0 right-0 p-6 bg-white dark:bg-slate-900 border-t border-slate-100 dark:border-slate-800 shrink-0">
                        <div className="flex gap-4">
                            <button onClick={onBack} className="flex-1 py-4 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold rounded-xl hover:bg-slate-50 transition-colors">
                                Atrás
                            </button>
                            <button onClick={onNext} className="flex-[2] py-4 bg-primary text-white font-semibold rounded-xl shadow-lg shadow-primary/30 hover:bg-primary/90 transition-all flex items-center justify-center gap-2">
                                Siguiente
                                <span className="material-icons" style={{ fontSize: '18px' }}>arrow_forward</span>
                            </button>
                        </div>
                        <div className="mt-8 flex justify-center">
                            <div className="w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
                        </div>
                    </div>
                </div>
            );
        };

        // Step 3: Warmup
        const Step3Warmup = ({ data, updateData, onNext, onBack }) => {
            const [custom, setCustom] = useState("");
            const options = [
                { id: 'elongacion', label: 'Elongación', icon: 'accessibility_new' },
                { id: 'postura', label: 'Postura', icon: 'accessibility' },
                { id: 'saltabilidad', label: 'Saltabilidad', icon: 'bolt' },
                { id: 'equilibrio', label: 'Equilibrio', icon: 'balance' },
                { id: 'fuerza', label: 'Fuerza Abd.', icon: 'fitness_center' }
            ];

            const toggle = (label) => {
                const w = data.warmup || [];
                const next = w.includes(label) ? w.filter(i => i !== label) : [...w, label];
                updateData({ warmup: next });
            };

            const addCustom = () => {
                if (!custom) return;
                const w = data.warmup || [];
                updateData({ warmup: [...w, custom] });
                setCustom("");
            };

            return (
                <div className="w-full max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 flex flex-col relative shadow-2xl overflow-hidden">
                    {/* Header */}
                    <header className="px-6 py-4 border-b border-slate-200 dark:border-slate-800 shrink-0">
                        <div className="flex items-center justify-between">
                            <button onClick={onBack} className="text-primary flex items-center gap-1">
                                <span className="material-icons">arrow_back_ios</span>
                                <span className="text-lg">Atrás</span>
                            </button>
                            <h1 className="text-xl font-bold text-slate-800 dark:text-white absolute left-1/2 -translate-x-1/2">Entrada en Calor</h1>
                            <div className="w-10"></div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 p-6 overflow-y-auto pb-32">
                        {/* Progress */}
                        <div className="mb-8">
                            <div className="flex justify-between items-end mb-2">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Configuración</span>
                                <span className="text-sm font-bold text-primary">Paso 3 de 6</span>
                            </div>
                            <div className="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                                <div className="bg-primary h-full w-1/2 rounded-full"></div>
                            </div>
                        </div>

                        <section>
                            <h2 className="text-2xl font-semibold text-slate-800 dark:text-white mb-2">Objetivos</h2>
                            <p className="text-slate-500 dark:text-slate-400 mb-6 text-sm">Selecciona las áreas de enfoque para hoy.</p>

                            {/* Grid */}
                            <div className="grid grid-cols-2 gap-3 mb-8">
                                {options.map(opt => (
                                    <button
                                        key={opt.id}
                                        onClick={() => toggle(opt.label)}
                                        className={`flex flex-col items-center justify-center p-4 rounded-xl border-2 transition-all active:scale-95 ${data.warmup?.includes(opt.label) ? 'bg-primary text-white border-primary shadow-md' : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-transparent'}`}
                                    >
                                        <span className="material-icons mb-2">{opt.icon}</span>
                                        <span className="font-medium text-sm">{opt.label}</span>
                                    </button>
                                ))}
                                <div className="flex items-center justify-center p-4 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl opacity-50">
                                    <span className="material-icons text-slate-400">add_circle_outline</span>
                                </div>
                            </div>

                            {/* Custom */}
                            <div className="space-y-3">
                                {data.warmup?.filter(i => !options.some(o => o.label === i)).length > 0 && (
                                    <p className="text-sm text-slate-500 italic">Extras: {data.warmup.filter(i => !options.some(o => o.label === i)).join(", ")}</p>
                                )}
                                <div className="flex gap-2">
                                    <input
                                        className="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg py-3 px-4 focus:border-primary outline-none transition-colors text-slate-900 dark:text-white"
                                        placeholder="Otro objetivo..."
                                        value={custom}
                                        onChange={e => setCustom(e.target.value)}
                                    />
                                    <button onClick={addCustom} className="bg-primary text-white w-12 h-12 flex items-center justify-center rounded-lg shadow-lg active:scale-95 transition-transform">
                                        <span className="material-icons">add</span>
                                    </button>
                                </div>
                            </div>
                        </section>
                    </main>

                    {/* Footer */}
                    <footer className="p-6 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 shrink-0">
                        <div className="flex gap-4">
                            <button onClick={onBack} className="flex-1 py-4 px-6 rounded-xl font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 active:scale-95 transition-transform">
                                Atrás
                            </button>
                            <button onClick={onNext} className="flex-[2] py-4 px-6 rounded-xl font-semibold text-white bg-primary shadow-xl shadow-primary/25 active:scale-95 transition-all flex items-center justify-center gap-2">
                                <span>Siguiente</span>
                                <span className="material-icons text-sm">arrow_forward</span>
                            </button>
                        </div>
                        <div className="mt-8 flex justify-center">
                            <div className="w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
                        </div>
                    </footer>
                </div>
            );
        };

        // Step 4: Apparatus
        const Step4Apparatus = ({ data, updateData, onNext, onBack }) => {
            const list = [
                { id: 'viga', name: 'Viga', icon: 'horizontal_rule' },
                { id: 'paralelas', name: 'Paralelas', icon: 'reorder' },
                { id: 'suelo', name: 'Suelo', icon: 'grid_view' },
                { id: 'salto', name: 'Salto', icon: 'trending_up' }
            ];

            const toggle = (id) => {
                const s = new Set(data.apparatus);
                if (s.has(id)) s.delete(id); else s.add(id);
                updateData({ apparatus: Array.from(s) });
            };

            const isSelected = (id) => (data.apparatus || []).includes(id);

            return (
                <div className="w-full max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 flex flex-col relative shadow-2xl overflow-hidden">
                    {/* Header */}
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
                        <div className="px-4 h-16 flex items-center justify-between">
                            <button onClick={onBack} className="flex items-center text-primary font-medium">
                                <span className="material-icons-round text-3xl">chevron_left</span>
                                <span className="text-lg">Atrás</span>
                            </button>
                            <h1 className="text-lg font-bold absolute left-1/2 -translate-x-1/2 dark:text-white">Aparatos</h1>
                            <div className="w-10"></div>
                        </div>
                    </header>

                    <main className="flex-1 px-6 py-8 overflow-y-auto pb-32">
                        {/* Step Indicator */}
                        <div className="text-center mb-8">
                            <p className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Paso 4 de 6</p>
                            <div className="flex justify-center gap-1.5 mt-3">
                                <div className="h-1.5 w-6 rounded-full bg-primary/30"></div>
                                <div className="h-1.5 w-6 rounded-full bg-primary/30"></div>
                                <div className="h-1.5 w-6 rounded-full bg-primary/30"></div>
                                <div className="h-1.5 w-10 rounded-full bg-primary"></div>
                                <div className="h-1.5 w-6 rounded-full bg-slate-200 dark:bg-slate-700"></div>
                                <div className="h-1.5 w-6 rounded-full bg-slate-200 dark:bg-slate-700"></div>
                            </div>
                        </div>

                        {/* Text */}
                        <div className="mb-8">
                            <h2 className="text-2xl font-bold text-slate-900 dark:text-white mb-2">Selecciona el equipo</h2>
                            <p className="text-slate-500 dark:text-slate-400 text-sm">Elige los aparatos que se utilizarán hoy.</p>
                        </div>

                        {/* Grid */}
                        <div className="grid grid-cols-2 gap-4">
                            {list.map(l => (
                                <button
                                    key={l.id}
                                    onClick={() => toggle(l.id)}
                                    className={`aspect-square rounded-xl shadow-sm border-2 transition-all flex flex-col items-center justify-center p-4 active:scale-95 ${isSelected(l.id) ? 'bg-primary/10 border-primary' : 'bg-white dark:bg-slate-800 border-transparent hover:border-slate-200 dark:hover:border-slate-700'}`}
                                >
                                    <div className={`w-16 h-16 mb-4 flex items-center justify-center rounded-full transition-colors ${isSelected(l.id) ? 'bg-primary text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}`}>
                                        <span className="material-icons-round text-4xl">{l.icon}</span>
                                    </div>
                                    <span className={`font-semibold ${isSelected(l.id) ? 'text-primary font-bold' : 'text-slate-700 dark:text-slate-200'}`}>{l.name}</span>
                                </button>
                            ))}
                        </div>
                    </main>

                    {/* Footer Nav */}
                    <footer className="absolute bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 pb-10">
                        <div className="px-6 py-5 flex items-center gap-4">
                            <button onClick={onBack} className="flex-1 py-4 px-6 rounded-xl font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 active:scale-95 transition-transform">
                                Atrás
                            </button>
                            <button
                                onClick={onNext}
                                disabled={!data.apparatus || data.apparatus.length === 0}
                                className="flex-[2] py-4 px-6 rounded-xl font-bold text-white bg-primary shadow-lg shadow-primary/25 disabled:opacity-50 active:scale-95 transition-all flex items-center justify-center gap-2"
                            >
                                Siguiente
                                <span className="material-icons text-sm">arrow_forward</span>
                            </button>
                        </div>
                        <div className="w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto"></div>
                    </footer>
                </div>
            );
        };

        // Step 5: Skills
        const Step5Skills = ({ data, updateData, onNext, onBack }) => {
            const [idx, setIdx] = useState(0);
            const [custom, setCustom] = useState("");
            const currentApp = data.apparatus[idx];
            const skillsMap = data.skills || {};
            const currentSkills = skillsMap[currentApp] || [];

            const suggestions = {
                viga: ['Caminar', 'Salto Extendido', 'Media Luna', 'Flic Flac', 'Rondo'],
                paralelas: ['Suspensión', 'Balanceos', 'Kip', 'Vuelta Atrás', 'Salida'],
                suelo: ['Rol adelante', 'Vertical', 'Media Luna', 'Mortero', 'Rondo'],
                salto: ['Carrera', 'Rebote', 'Salto al cajón', 'Mortero']
            };

            const toggle = (s) => {
                const newSkills = currentSkills.includes(s) ? currentSkills.filter(x => x !== s) : [...currentSkills, s];
                updateData({ skills: { ...skillsMap, [currentApp]: newSkills } });
            };

            const addCustom = () => {
                if (!custom) return;
                toggle(custom);
                setCustom("");
            };

            const handleNext = () => {
                if (idx < data.apparatus.length - 1) setIdx(idx + 1); else onNext();
            };
            const handleBack = () => {
                if (idx > 0) setIdx(idx - 1); else onBack();
            };

            const appName = currentApp ? currentApp.charAt(0).toUpperCase() + currentApp.slice(1) : "";

            return (
                <div className="w-full max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 shadow-2xl overflow-hidden relative flex flex-col">
                    {/* Header */}
                    <header className="px-6 pt-4 pb-2 flex items-center gap-4 shrink-0">
                        <button onClick={handleBack} className="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            <span className="material-icons text-slate-600 dark:text-slate-300">arrow_back_ios_new</span>
                        </button>
                        <h1 className="text-xl font-bold text-slate-900 dark:text-white uppercase tracking-tight">{appName}</h1>
                        <span className="ml-auto text-sm font-bold text-slate-400">{idx + 1}/{data.apparatus.length}</span>
                    </header>

                    {/* Main Content */}
                    <main className="flex-1 overflow-y-auto px-6 pt-2 pb-32">
                        {/* Step Indicator */}
                        <div className="mb-8">
                            <div className="flex justify-between items-center mb-2">
                                <span className="text-sm font-medium text-slate-500 dark:text-slate-400">Paso 5 de 6</span>
                                <span className="text-xs font-bold text-primary">83%</span>
                            </div>
                            <div className="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                                <div className="h-full bg-primary rounded-full transition-all" style={{ width: '83%' }}></div>
                            </div>
                        </div>

                        {/* Suggestions */}
                        <section className="mb-8">
                            <h2 className="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300">Habilidades Sugeridas</h2>
                            <div className="flex flex-wrap gap-3">
                                {(suggestions[currentApp] || []).map(s => (
                                    <button
                                        key={s}
                                        onClick={() => toggle(s)}
                                        className={`px-5 py-2.5 rounded-full text-sm font-medium transition-all flex items-center gap-2 ${currentSkills.includes(s) ? 'bg-primary text-white shadow-lg' : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700'}`}
                                    >
                                        {s} {currentSkills.includes(s) && <span className="material-icons text-xs">check</span>}
                                    </button>
                                ))}
                            </div>
                        </section>

                        {/* Custom Input */}
                        <section className="mb-10">
                            <label className="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2">¿Otra habilidad?</label>
                            <div className="relative group">
                                <input
                                    className="w-full h-14 pl-5 pr-14 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400 text-slate-900 dark:text-white"
                                    placeholder="Escribir..."
                                    value={custom}
                                    onChange={e => setCustom(e.target.value)}
                                />
                                <button onClick={addCustom} className="absolute right-2 top-2 bottom-2 w-10 h-10 bg-primary text-white rounded-lg flex items-center justify-center shadow-lg active:scale-95 transition-transform">
                                    <span className="material-icons">add</span>
                                </button>
                            </div>
                        </section>

                        {/* Summary for current app */}
                        {currentSkills.length > 0 && (
                            <section className="p-5 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800">
                                <div className="flex items-center gap-2 mb-4">
                                    <span className="material-icons text-primary text-lg">list_alt</span>
                                    <h2 className="text-base font-bold text-slate-800 dark:text-white">Seleccionados ({currentSkills.length})</h2>
                                </div>
                                <div className="space-y-3">
                                    {currentSkills.map(s => (
                                        <div key={s} className="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-lg shadow-sm">
                                            <span className="text-sm font-medium dark:text-white">{s}</span>
                                            <button onClick={() => toggle(s)} className="text-slate-400 hover:text-red-500">
                                                <span className="material-icons text-sm">close</span>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </section>
                        )}
                    </main>

                    {/* Bottom Nav */}
                    <footer className="absolute bottom-0 left-0 right-0 p-6 pb-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 flex gap-4 shrink-0">
                        <button onClick={handleBack} className="flex-1 py-4 px-6 border-2 border-slate-200 dark:border-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-50 transition-colors">
                            Atrás
                        </button>
                        <button onClick={handleNext} className="flex-[2] py-4 px-6 bg-primary text-white rounded-xl font-bold shadow-xl shadow-primary/25 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                            {idx < data.apparatus.length - 1 ? 'Siguiente Aparato' : 'Continuar'}
                            <span className="material-icons text-sm">arrow_forward</span>
                        </button>
                    </footer>

                    {/* iOS Home Indicator */}
                    <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
                </div>
            );
        };

        // Step 6: Summary
        const Step6Summary = ({ data, onSave, onBack }) => {
            const presentCount = (data.attendance || []).length;
            const formatDateNice = (iso) => {
                if (!iso) return "N/A";
                const d = new Date(iso + 'T12:00:00');
                return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
            };

            return (
                <div className="w-full max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 flex flex-col relative shadow-2xl overflow-hidden">
                    {/* Header */}
                    <header className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-10 px-4 py-3 flex items-center justify-between shrink-0">
                        <div className="flex items-center gap-3">
                            <button onClick={onBack} className="flex items-center justify-center p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                <span className="material-icons-round text-slate-600 dark:text-slate-400">arrow_back_ios_new</span>
                            </button>
                            <h1 className="text-xl font-semibold tracking-tight dark:text-white">Resumen</h1>
                        </div>
                    </header>

                    {/* Progress Indicator */}
                    <div className="px-6 py-4 shrink-0">
                        <div className="flex flex-col gap-1.5">
                            <div className="flex justify-between items-end">
                                <span className="text-xs font-medium text-slate-500 uppercase tracking-wider">Progreso</span>
                                <span className="text-xs font-semibold text-primary">Paso 6 de 6</span>
                            </div>
                            <div className="w-full bg-slate-200 dark:bg-slate-800 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-primary h-full w-full"></div>
                            </div>
                        </div>
                    </div>

                    {/* Main Content Area */}
                    <main className="flex-1 px-6 pb-40 overflow-y-auto">
                        <div className="flex flex-col items-center justify-center py-8 text-center">
                            <div className="w-20 h-20 bg-green-100 dark:bg-green-900/30 rounded-full flex items-center justify-center mb-4">
                                <span className="material-icons-round text-green-500 text-5xl">check_circle</span>
                            </div>
                            <h2 className="text-2xl font-bold text-slate-800 dark:text-white">¡Todo Listo!</h2>
                            <p className="text-slate-500 dark:text-slate-400 text-sm mt-1">Revisa los detalles antes de guardar.</p>
                        </div>

                        {/* Summary Card */}
                        <div className="bg-white dark:bg-slate-800/50 rounded-xl shadow-sm border border-slate-200/60 dark:border-slate-700 p-6 space-y-6">
                            <div className="border-b border-slate-100 dark:border-slate-700 pb-4">
                                <h3 className="text-xs font-bold text-primary uppercase tracking-widest mb-1">Grupo</h3>
                                <p className="text-xl font-bold text-slate-800 dark:text-white">{data.groupName || 'Sin Nombre'}</p>
                            </div>

                            <div className="space-y-5">
                                <div className="flex items-start gap-4">
                                    <div className="w-10 h-10 rounded-lg bg-primary/10 dark:bg-primary/20 flex items-center justify-center shrink-0">
                                        <span className="material-icons-round text-primary">calendar_today</span>
                                    </div>
                                    <div>
                                        <p className="text-xs font-medium text-slate-500">Fecha y Horario</p>
                                        <p className="text-base font-semibold text-slate-800 dark:text-slate-100 capitalize">
                                            {formatDateNice(data.date)}
                                        </p>
                                        <p className="text-xs font-bold text-primary mt-1">
                                            {data.startTime} - {data.endTime} | {(data.selectedDays || []).map(d => d.split('-')[0]).join(' ')}
                                        </p>
                                    </div>
                                </div>

                                <div className="flex items-start gap-4">
                                    <div className="w-10 h-10 rounded-lg bg-primary/10 dark:bg-primary/20 flex items-center justify-center shrink-0">
                                        <span className="material-icons-round text-primary">group</span>
                                    </div>
                                    <div>
                                        <p className="text-xs font-medium text-slate-500">Asistencia</p>
                                        <p className="text-base font-semibold text-slate-800 dark:text-slate-100">{presentCount} Presentes</p>
                                    </div>
                                </div>

                                <div className="flex items-start gap-4">
                                    <div className="w-10 h-10 rounded-lg bg-primary/10 dark:bg-primary/20 flex items-center justify-center shrink-0">
                                        <span className="material-icons-round text-primary">fitness_center</span>
                                    </div>
                                    <div>
                                        <p className="text-xs font-medium text-slate-500">Aparatos</p>
                                        <div className="flex flex-wrap gap-2 mt-1">
                                            {(data.apparatus || []).map(a => (
                                                <span key={a} className="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 px-3 py-1 rounded-full text-xs font-medium capitalize">{a}</span>
                                            ))}
                                            {(data.apparatus || []).length === 0 && <span className="text-slate-400 text-sm italic">Ninguno</span>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Extra Note */}
                        <div className="mt-6 p-4 rounded-lg bg-slate-50 dark:bg-slate-800/50 border border-dashed border-slate-300 dark:border-slate-700">
                            <p className="text-sm text-slate-600 dark:text-slate-400 italic flex items-center gap-2">
                                <span className="material-icons-round text-base">info</span>
                                La clase se guardará localmente en el dispositivo.
                            </p>
                        </div>
                    </main>

                    {/* Bottom Actions */}
                    <div className="absolute bottom-0 left-0 right-0 bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 px-6 py-4 flex flex-col gap-4 shrink-0">
                        <div className="flex gap-4">
                            <button onClick={onBack} className="flex-1 py-3.5 px-4 rounded-xl border-2 border-primary text-primary font-bold hover:bg-primary/5 transition-colors">
                                Corregir
                            </button>
                            <button onClick={onSave} className="flex-[2] py-3.5 px-4 rounded-xl bg-primary text-white font-bold shadow-lg shadow-primary/30 hover:bg-primary/90 active:scale-[0.98] transition-all">
                                Guardar Clase
                            </button>
                        </div>
                        <div className="pb-4 flex justify-center">
                            <div className="w-32 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [view, setView] = useState('dashboard'); // dashboard, wizard, students, reports, student_detail
            const [selectedStudentId, setSelectedStudentId] = useState(null);
            const [selectedClassId, setSelectedClassId] = useState(null);
            const [wizardStep, setWizardStep] = useState(0);
            const [wizardData, setWizardData] = useState({
                date: new Date().toISOString().split('T')[0],
                groupName: '',
                coachName: '',
                attendance: [],
                warmup: [],
                apparatus: [],
                skills: {},
                selectedDays: [],
                startTime: '17:00',
                endTime: '18:30'
            });

            // Check authentication state
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged((currentUser) => {
                    setUser(currentUser);
                    setAuthLoading(false);
                });
                return () => unsubscribe();
            }, []);

            if (authLoading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-900">
                        <div className="text-center">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl mb-4 animate-pulse">
                                <span className="material-icons text-white text-3xl">fitness_center</span>
                            </div>
                            <p className="text-slate-600 dark:text-slate-400 font-medium">Cargando...</p>
                        </div>
                    </div>
                );
            }

            if (!user) {
                return <AuthScreen onAuthSuccess={() => setUser(auth.currentUser)} />;
            }

            const startWizard = () => {
                setWizardData({
                    date: new Date().toISOString().split('T')[0],
                    groupName: '',
                    coachName: '',
                    attendance: [],
                    warmup: [],
                    apparatus: [],
                    skills: {},
                    selectedDays: [],
                    startTime: '17:00',
                    endTime: '18:30'
                });
                setWizardStep(0);
                setView('wizard');
            };

            const handleWizardFinish = async () => {
                await db.classes.add(wizardData);
                setView('dashboard');
            };

            const updateWizardData = (d) => setWizardData(prev => ({ ...prev, ...d }));

            if (view === 'students') return (
                <StudentsList
                    onBack={() => setView('dashboard')}
                    onSelectStudent={(id) => { setSelectedStudentId(id); setView('student_detail'); }}
                />
            );

            if (view === 'reports') return (
                <Reports
                    onBack={() => setView('dashboard')}
                    onViewDashboard={() => setView('dashboard')}
                    onViewStudents={() => setView('students')}
                    onViewAttendanceReport={() => setView('attendance_report')}
                    view={view}
                />
            );

            if (view === 'student_detail') return (
                <StudentDetail
                    studentId={selectedStudentId}
                    onBack={() => setView('students')}
                />
            );

            if (view === 'class_detail') return (
                <ClassDetail
                    classId={selectedClassId}
                    onBack={() => setView('dashboard')}
                />
            );

            if (view === 'settings') return (
                <Settings
                    onBack={() => setView('dashboard')}
                />
            );

            if (view === 'attendance_report') return (
                <AttendanceReport
                    onBack={() => setView('reports')}
                />
            );

            if (view === 'wizard') {
                if (wizardStep === 0) return <Step1Setup data={wizardData} updateData={updateWizardData} onNext={() => setWizardStep(1)} onCancel={() => setView('dashboard')} />;
                if (wizardStep === 1) return <Step2Attendance data={wizardData} updateData={updateWizardData} onNext={() => setWizardStep(2)} onBack={() => setWizardStep(0)} />;
                if (wizardStep === 2) return <Step3Warmup data={wizardData} updateData={updateWizardData} onNext={() => setWizardStep(3)} onBack={() => setWizardStep(1)} />;
                if (wizardStep === 3) return <Step4Apparatus data={wizardData} updateData={updateWizardData} onNext={() => setWizardStep(4)} onBack={() => setWizardStep(2)} />;
                if (wizardStep === 4) return <Step5Skills data={wizardData} updateData={updateWizardData} onNext={() => setWizardStep(5)} onBack={() => setWizardStep(3)} />;
                if (wizardStep === 5) return <Step6Summary data={wizardData} onSave={handleWizardFinish} onBack={() => setWizardStep(4)} />;
            }

            return (
                <Dashboard
                    onStart={startWizard}
                    onViewStudents={() => setView('students')}
                    onViewReports={() => setView('reports')}
                    onViewSettings={() => setView('settings')}
                    onViewClass={(id) => { setSelectedClassId(id); setView('class_detail'); }}
                    view={view}
                />
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Failed', err));
            });
        }
    </script>
</body>

</html>
