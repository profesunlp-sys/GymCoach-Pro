<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>GymCoach Pro - Antigravity</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00F2FF", // Neon Cyan
                        "background-light": "#F8FAFC",
                        "background-dark": "#0B0E14", // Deep Charcoal Black
                        "card-dark": "#161B22",
                        "accent-purple": "#7000FF",
                        "accent-blue": "#0066FF"
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "16px",
                    },
                    boxShadow: {
                        'neon': '0 0 15px rgba(0, 242, 255, 0.4)',
                        'glow-purple': '0 0 25px rgba(112, 0, 255, 0.3)',
                    }
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .antigravity-gradient {
                background: linear-gradient(135deg, #0066FF 0%, #7000FF 100%);
            }
            .neon-border {
                border: 1px solid rgba(0, 242, 255, 0.5);
                box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
            }
            .glass-effect {
                backdrop-filter: blur(10px);
                background: rgba(255, 255, 255, 0.05);
            }
            .active-glow {
                filter: drop-shadow(0 0 5px #00F2FF);
            }
            .ios-input-shadow {
                box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.1);
            }
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        .page-transition { 
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .auth-bg {
            background: radial-gradient(circle at top right, #0066FF, #7000FF, #0B0E14);
            min-height: 100vh;
        }
    </style>
    <script>
        window.process = {
            env: { API_KEY: "" },
            browser: true,
            version: ''
        };
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "dexie": "https://esm.sh/dexie@^4.3.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
      }
    }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
