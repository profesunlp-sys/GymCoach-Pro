<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>GymCoach Pro - Antigravity Suite</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#00F5FF", // Neon Cyan
              secondary: "#7C3AED", // Lilac / Purple
              "antigravity-black": "#0A0A0B",
              "antigravity-charcoal": "#121214",
              "neon-cyan": "#00F5FF",
              "neon-blue": "#2E5BFF",
              "accent-purple": "#8B5CF6",
              "background-dark": "#0A0A0B",
            },
            fontFamily: {
              display: ["Lexend", "sans-serif"],
            },
            boxShadow: {
              'neon-cyan': '0 0 15px rgba(0, 245, 255, 0.3)',
              'neon-purple': '0 0 15px rgba(139, 92, 246, 0.4)',
              'neon-fab-blue': '0 0 20px rgba(46, 91, 255, 0.6)',
            }
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
            .auth-bg {
                background: radial-gradient(circle at 50% 40%, #5c59f0 0%, #312e81 40%, #0a0a0b 100%);
            }
            .gradient-header {
                background: linear-gradient(135deg, #4338ca 0%, #6d28d9 100%);
            }
            .neon-border {
                border: 1px solid #00F5FF;
                box-shadow: 0 0 8px rgba(0, 245, 255, 0.3);
            }
            .neon-border-cyan {
                box-shadow: 0 0 5px rgba(0, 245, 255, 0.3);
            }
            .neon-fab-blue {
                box-shadow: 0 0 20px rgba(46, 91, 255, 0.6);
            }
            .active-glow {
                filter: drop-shadow(0 0 5px #00F5FF);
            }
            .neon-glow-cyan {
                text-shadow: 0 0 10px rgba(0, 245, 255, 0.5), 0 0 20px rgba(0, 245, 255, 0.2);
            }
            .ios-toggle:checked + .ios-toggle-label {
                background-color: #00F5FF;
                box-shadow: 0 0 8px rgba(0, 245, 255, 0.6);
            }
            .ios-toggle:checked + .ios-toggle-label::after {
                transform: translateX(20px);
                background-color: #0A0A0B;
            }
            .crafted-input {
                @apply bg-antigravity-charcoal border border-neon-blue/30 rounded-2xl px-5 py-4 text-sm text-white transition-all outline-none shadow-inner placeholder:text-white/70;
            }
            .crafted-input:focus {
                @apply border-neon-blue ring-1 ring-neon-blue/50 shadow-[0_0_15px_rgba(46,91,255,0.2)];
            }
        }
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #0A0A0B;
            color: #ffffff;
        }
        .page-transition { 
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
    <script>
        window.process = {
            env: { API_KEY: "" },
            browser: true,
            version: ''
        };
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
      }
    }
    </script>
</head>
<body class="bg-antigravity-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
