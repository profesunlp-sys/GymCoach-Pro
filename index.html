<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymCoach Pro v2.1</title>
    
    <!-- Dependencias críticas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] }, colors: { slate: { 850: '#151e2e', 950: '#020617' } } } }
        }
    </script>
    <style>
        body { background-color: #020617; color: white; -webkit-tap-highlight-color: transparent; overflow-x: hidden; font-family: 'Inter', sans-serif; }
        .animate-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Configuración Global ---
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDummyKey", 
            authDomain: "gymcoach-pro.firebaseapp.com",
            projectId: "gymcoach-pro",
            storageBucket: "gymcoach-pro.appspot.com",
            messagingSenderId: "00000000",
            appId: "1:00000000:web:00000000"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'gymcoach-pro-v2';
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.error("Error de inicialización de Firebase:", e);
        }

        const { useState, useEffect } = React;
        const { 
            Trophy, ChevronLeft, LayoutDashboard, 
            Activity, Users, LogOut, Trash2, Plus, Bell, Save, AlertCircle, RefreshCw
        } = lucide;

        // --- Componente de Autenticación ---
        const AuthScreen = () => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);

                if (!auth) {
                    setError("Error de configuración: Firebase no detectado.");
                    setLoading(false);
                    return;
                }

                try {
                    // Limpieza previa por seguridad
                    await signOut(auth).catch(() => {});
                    
                    const cleanEmail = email.trim().toLowerCase();

                    if (isLogin) {
                        await signInWithEmailAndPassword(auth, cleanEmail, password);
                    } else {
                        if (password.length < 6) throw { code: 'auth/weak-password' };
                        await createUserWithEmailAndPassword(auth, cleanEmail, password);
                    }
                } catch (err) {
                    console.error("Firebase Auth Error:", err.code, err.message);
                    switch (err.code) {
                        case 'auth/invalid-credential':
                        case 'auth/user-not-found':
                        case 'auth/wrong-password':
                            setError("Email o clave incorrectos.");
                            break;
                        case 'auth/email-already-in-use':
                            setError("Este email ya está en uso. Intenta iniciar sesión.");
                            break;
                        case 'auth/weak-password':
                            setError("Clave muy corta (mínimo 6 caracteres).");
                            break;
                        case 'auth/too-many-requests':
                            setError("Demasiados intentos. Espera unos minutos.");
                            break;
                        case 'auth/network-request-failed':
                            setError("Error de red. Revisa tu conexión.");
                            break;
                        default:
                            setError("Error: " + (err.code || "Desconocido"));
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-6 animate-in">
                    <div className="bg-slate-900 w-full max-w-sm rounded-[2.5rem] p-10 border border-slate-800 text-center shadow-2xl relative">
                        <h1 className="text-3xl font-black italic mb-2 tracking-tighter">GYMCOACH <span className="text-blue-500">PRO</span></h1>
                        <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest mb-8">Management System v2.1</p>
                        
                        <form onSubmit={handleAuth} className="space-y-4 text-left">
                            <div className="space-y-1">
                                <label className="text-[9px] font-black text-slate-500 uppercase ml-2">Email</label>
                                <input 
                                    type="email" 
                                    placeholder="ejemplo@gym.com" 
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full p-4 bg-slate-800 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-600 transition-all text-white placeholder:text-slate-600" 
                                    required
                                />
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] font-black text-slate-500 uppercase ml-2">Contraseña</label>
                                <input 
                                    type="password" 
                                    placeholder="••••••••" 
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full p-4 bg-slate-800 rounded-2xl border-none outline-none focus:ring-2 focus:ring-blue-600 transition-all text-white placeholder:text-slate-600" 
                                    required
                                />
                            </div>

                            {error && (
                                <div className="flex items-center gap-2 bg-red-500/10 p-3 rounded-xl border border-red-500/20 animate-in">
                                    <AlertCircle size={14} className="text-red-500 shrink-0" />
                                    <p className="text-red-500 text-[10px] font-bold uppercase leading-tight">{error}</p>
                                </div>
                            )}

                            <button 
                                type="submit" 
                                disabled={loading}
                                className="w-full py-5 bg-blue-600 rounded-2xl font-black text-white shadow-xl active:scale-95 transition-transform disabled:opacity-50 mt-4 flex justify-center items-center gap-2"
                            >
                                {loading && <RefreshCw size={16} className="animate-spin"/>}
                                {loading ? 'CONECTANDO...' : (isLogin ? 'INICIAR SESIÓN' : 'CREAR CUENTA')}
                            </button>
                        </form>

                        <button 
                            onClick={() => { setIsLogin(!isLogin); setError(''); }}
                            className="mt-6 text-[10px] font-bold text-slate-500 uppercase tracking-widest hover:text-white transition-colors"
                        >
                            {isLogin ? '¿No tienes cuenta? Regístrate' : '¿Ya tienes cuenta? Entra'}
                        </button>

                        <button 
                            onClick={() => window.location.reload()}
                            className="absolute -bottom-12 left-1/2 -translate-x-1/2 text-[8px] text-slate-700 font-bold uppercase tracking-[0.3em]"
                        >
                            Refrescar Aplicación
                        </button>
                    </div>
                </div>
            );
        };

        // --- Pantalla de Premiación ---
        const PremiacionScreen = ({ user, onBack }) => {
            const [data, setData] = useState({ 
                inscripcion: 2500, 
                medallas: [
                    {puesto: 1, diametro: "50mm", precio: 1200},
                    {puesto: 2, diametro: "40mm", precio: 950},
                    {puesto: 3, diametro: "40mm", precio: 950}
                ] 
            });
            const [saving, setSaving] = useState(false);

            useEffect(() => {
                if (!user || !db) return;
                try {
                    const unsub = onSnapshot(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'premiacion'), (snap) => {
                        if (snap.exists()) setData(snap.data());
                    }, (err) => console.log("Sync info:", err.message));
                    return () => unsub();
                } catch(e) { console.error(e); }
            }, [user]);

            const handleSave = async () => {
                if (!user || !db) return;
                setSaving(true);
                try {
                    await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'premiacion'), data);
                } catch (e) {
                    console.error("Save error:", e);
                } finally {
                    setTimeout(() => setSaving(false), 800);
                }
            };

            const total = data.medallas.reduce((acc, m) => acc + Number(m.precio || 0), 0);

            return (
                <div className="animate-in pb-32">
                    <div className="flex items-center justify-between mb-8 pt-4">
                        <button onClick={onBack} className="p-4 bg-slate-900 rounded-2xl border border-slate-800 active:scale-90 transition-all">
                            <ChevronLeft size={20}/>
                        </button>
                        <h2 className="text-xl font-black italic uppercase">Costos <span className="text-blue-500">Premios</span></h2>
                        <div className="w-12"></div>
                    </div>

                    <div className="bg-slate-900 p-6 rounded-[2rem] border border-slate-800 mb-6">
                        <label className="text-[10px] font-black text-slate-500 uppercase tracking-widest">Inscripción Alumno</label>
                        <div className="flex items-center gap-2 mt-2">
                            <span className="text-3xl text-blue-500 font-black">$</span>
                            <input type="number" value={data.inscripcion} onChange={e=>setData({...data, inscripcion:e.target.value})} className="bg-transparent text-4xl font-black w-full outline-none text-white" />
                        </div>
                    </div>

                    <div className="bg-slate-900 p-6 rounded-[2rem] border border-slate-800">
                        <div className="flex justify-between items-center mb-6">
                            <label className="text-[10px] font-black text-amber-500 uppercase tracking-widest flex items-center gap-2">
                                <Trophy size={14}/> Medallas por Puesto
                            </label>
                            <button onClick={()=>setData({...data, medallas:[...data.medallas, {puesto:data.medallas.length+1, diametro:"", precio:0}]})} className="bg-blue-600 p-2 rounded-full active:scale-90 transition-all text-white"><Plus size={16}/></button>
                        </div>
                        <div className="space-y-3">
                            {data.medallas.map((m, i) => (
                                <div key={i} className="flex gap-3 items-center bg-slate-950 p-3 rounded-2xl border border-slate-800">
                                    <span className="w-8 h-8 flex items-center justify-center bg-slate-800 rounded-xl font-black text-[10px] text-slate-500">{m.puesto}º</span>
                                    <input type="text" placeholder="mm" value={m.diametro} onChange={e=>{let n=[...data.medallas];n[i].diametro=e.target.value;setData({...data, medallas:n})}} className="bg-transparent w-full text-xs font-bold outline-none text-white" />
                                    <div className="flex items-center gap-1 bg-slate-900 px-3 py-1 rounded-lg">
                                        <span className="text-blue-500 font-black text-xs">$</span>
                                        <input type="number" value={m.precio} onChange={e=>{let n=[...data.medallas];n[i].precio=e.target.value;setData({...data, medallas:n})}} className="bg-transparent w-16 text-right text-xs font-black outline-none text-white" />
                                    </div>
                                    {i > 2 && <button onClick={()=>setData({...data, medallas:data.medallas.filter((_,x)=>x!==i)})} className="text-slate-600 hover:text-red-500"><Trash2 size={16}/></button>}
                                </div>
                            ))}
                        </div>
                        <div className="mt-8 pt-6 border-t border-slate-800 flex justify-between items-center">
                            <span className="text-[10px] font-black uppercase text-slate-500">Costo total set</span>
                            <span className="text-3xl font-black text-white">${total}</span>
                        </div>
                    </div>

                    <button 
                        onClick={handleSave}
                        disabled={saving}
                        className={`w-full mt-8 py-6 rounded-[2rem] font-black uppercase tracking-widest text-xs shadow-2xl active:scale-95 transition-all flex items-center justify-center gap-2 ${saving ? 'bg-emerald-500 text-white' : 'bg-white text-slate-950'}`}
                    >
                        {saving ? <Activity className="animate-spin" size={16}/> : <Save size={16}/>}
                        {saving ? 'GUARDANDO...' : 'GUARDAR CONFIGURACIÓN'}
                    </button>
                </div>
            );
        };

        const App = () => {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('home');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if (!auth) {
                    setLoading(false);
                    return;
                }
                const unsubscribe = onAuthStateChanged(auth, (u) => {
                    setUser(u);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [user, view, loading]);

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-slate-950 text-white">
                    <div className="text-center">
                        <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                        <p className="text-[10px] font-black uppercase tracking-widest text-slate-500">Iniciando v2.1</p>
                    </div>
                </div>
            );

            if (!user) return <AuthScreen />;

            return (
                <div className="max-w-md mx-auto p-6 min-h-screen relative text-white">
                    {view === 'home' ? (
                        <div className="animate-in">
                            <header className="flex justify-between items-center mb-10 pt-4">
                                <div>
                                    <h1 className="text-3xl font-black italic tracking-tighter">GYMCOACH <span className="text-blue-500">PRO</span></h1>
                                    <div className="flex items-center gap-2 mt-1">
                                        <div className="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></div>
                                        <span className="text-[8px] font-black text-slate-500 uppercase tracking-widest">v2.1 ONLINE</span>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => signOut(auth)} 
                                    className="p-3 bg-red-500/10 rounded-2xl border border-red-500/20 text-red-500 active:scale-90 transition-all"
                                >
                                    <LogOut size={18}/>
                                </button>
                            </header>

                            <div 
                                onClick={() => setView('premiacion')} 
                                className="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[3rem] shadow-2xl relative overflow-hidden group cursor-pointer active:scale-95 transition-all border border-white/10"
                            >
                                <div className="relative z-10">
                                    <div className="bg-white/20 backdrop-blur-md px-3 py-1 rounded-full w-fit text-[8px] font-black uppercase mb-4 border border-white/20 tracking-widest">Módulo Financiero</div>
                                    <h2 className="text-4xl font-black italic leading-none mb-2">PREMIACIÓN</h2>
                                    <p className="text-blue-100/60 text-xs font-medium mb-8">Calcula inscripciones y medallas.</p>
                                    <div className="bg-white text-blue-900 font-black text-[9px] uppercase tracking-[0.2em] px-5 py-3 rounded-2xl w-fit shadow-lg">
                                        ABRIR MÓDULO
                                    </div>
                                </div>
                                <Trophy size={160} className="absolute -right-8 -bottom-8 text-white/10 rotate-12 group-hover:rotate-0 transition-all duration-700"/>
                            </div>

                            <div className="grid grid-cols-2 gap-4 mt-6">
                                <div className="bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800 opacity-40">
                                    <Users className="text-slate-500 mb-3" size={20}/>
                                    <p className="text-[9px] font-black text-slate-500 uppercase">Alumnos</p>
                                    <p className="text-lg font-black italic text-slate-700 uppercase">Pronto</p>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-[2.5rem] border border-slate-800 opacity-40">
                                    <Activity className="text-slate-500 mb-3" size={20}/>
                                    <p className="text-[9px] font-black text-slate-500 uppercase">Torneos</p>
                                    <p className="text-lg font-black italic text-slate-700 uppercase">Pronto</p>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <PremiacionScreen user={user} onBack={() => setView('home')} />
                    )}

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[85%] max-w-xs glass p-2 rounded-[2.5rem] flex justify-around shadow-2xl z-50">
                        <button onClick={() => setView('home')} className={`p-4 rounded-full transition-all ${view==='home'?'bg-blue-600 text-white shadow-lg shadow-blue-600/40':'text-slate-500'}`}><LayoutDashboard size={20}/></button>
                        <button onClick={() => setView('premiacion')} className={`p-4 rounded-full transition-all ${view==='premiacion'?'bg-blue-600 text-white shadow-lg shadow-blue-600/40':'text-slate-500'}`}><Trophy size={20}/></button>
                        <button className="p-4 rounded-full text-slate-500 opacity-20"><Bell size={20}/></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
