<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GymCoach Pro v2.0</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2964/2964514.png">

    <!-- React & DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#277bf1",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Lexend", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round"
        rel="stylesheet">

    <!-- Database: Dexie -->
    <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- jsPDF for PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: 'Lexend', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* IOS Toggle Style */
        .ios-toggle:checked+.ios-toggle-label {
            background-color: #277bf1;
        }

        .ios-toggle:checked+.ios-toggle-label::after {
            transform: translateX(100%);
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyBbuRw3J7t_8xQc-6_qOqQDdjEEWZgSHaY",
            authDomain: "gymcoachpro-c0c8e.firebaseapp.com",
            projectId: "gymcoachpro-c0c8e",
            storageBucket: "gymcoachpro-c0c8e.firebasestorage.app",
            messagingSenderId: "923517600594",
            appId: "1:923517600594:web:a81bdd1a150b7f22dcf08b"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // --- DATABASE ---
        const db = new Dexie('GymCoachProDB');
        db.version(1).stores({
            students: '++id, name, dob, dni, category, active',
            classes: '++id, date, groupName, coachName',
            settings: 'key'
        });
        db.version(2).stores({
            coaches: '++id, name'
        });
        db.version(3).stores({
            groups: '++id, name'
        });
        db.version(4).stores({
            students: '++id, name, dob, dni, category, active, registrationDate'
        });
        db.version(5).stores({
            alerts: '++id, studentId, studentName, absenceCount, date, acknowledged'
        });

        // --- UTILS ---
        const calculateAge = (dob) => {
            if (!dob) return 0;
            const diff = Date.now() - new Date(dob).getTime();
            return Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
        };

        const calculateSportCategory = (dob) => {
            if (!dob) return "N/A";
            const birthYear = new Date(dob).getFullYear();
            const currentYear = new Date().getFullYear();
            const ageThisYear = currentYear - birthYear;

            if (ageThisYear <= 5) return "Baby";
            if (ageThisYear <= 8) return "Pre-Infantil";
            if (ageThisYear <= 10) return "Infantil";
            if (ageThisYear <= 12) return "Juvenil";
            return "Mayor";
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '';
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateStr).toLocaleDateString('es-ES', options);
        };

        // Email validation - Block disposable emails
        const isValidEmail = (email) => {
            const allowedDomains = [
                'gmail.com', 'yahoo.com', 'hotmail.com', 'outlook.com',
                'live.com', 'icloud.com', 'aol.com', 'protonmail.com',
                'zoho.com', 'mail.com', 'gmx.com', 'yandex.com'
            ];
            const disposableDomains = [
                '10minutemail', 'tempmail', 'guerrillamail', 'mailinator',
                'throwaway', 'getnada', 'temp-mail', 'fakeinbox', 'trashmail'
            ];

            const domain = email.split('@')[1]?.toLowerCase();
            if (!domain) return false;

            // Block disposable domains
            if (disposableDomains.some(d => domain.includes(d))) return false;

            // Allow major providers or any corporate domain (has a dot)
            return allowedDomains.includes(domain) || domain.split('.').length >= 2;
        };

        // PDF Generation - Monthly Attendance Report
        const generateAttendancePDF = async (month, year) => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Get all classes for the selected month/year
            const allClasses = await db.classes.toArray();
            const monthClasses = allClasses.filter(c => {
                const classDate = new Date(c.date);
                return classDate.getMonth() === month && classDate.getFullYear() === year;
            });

            if (monthClasses.length === 0) {
                alert('No hay clases registradas para este mes.');
                return;
            }

            // Get all students
            const students = await db.students.toArray();

            // Calculate attendance for each student
            const attendanceData = students.map(student => {
                let attended = 0;
                let totalClasses = 0;

                monthClasses.forEach(classItem => {
                    if (classItem.attendance && classItem.attendance.includes(student.id)) {
                        attended++;
                    }
                    totalClasses++;
                });

                const absences = totalClasses - attended;
                const percentage = totalClasses > 0 ? ((attended / totalClasses) * 100).toFixed(1) : 0;

                return {
                    name: student.name,
                    category: student.category || 'N/A',
                    attended,
                    absences,
                    total: totalClasses,
                    percentage: percentage + '%'
                };
            });

            // PDF Header
            const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
                'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');
            doc.text('Reporte de Asistencia', 105, 20, { align: 'center' });

            doc.setFontSize(12);
            doc.setFont(undefined, 'normal');
            doc.text(`${monthNames[month]} ${year}`, 105, 28, { align: 'center' });

            // Table
            doc.autoTable({
                startY: 35,
                head: [['Alumno', 'Categoría', 'Asistió', 'Faltó', 'Total', '%']],
                body: attendanceData.map(d => [d.name, d.category, d.attended, d.absences, d.total, d.percentage]),
                theme: 'striped',
                headStyles: { fillColor: [39, 123, 241], fontSize: 10, fontStyle: 'bold' },
                styles: { fontSize: 9, cellPadding: 3 },
                columnStyles: {
                    0: { cellWidth: 60 },
                    1: { cellWidth: 30 },
                    2: { cellWidth: 20, halign: 'center' },
                    3: { cellWidth: 20, halign: 'center' },
                    4: { cellWidth: 20, halign: 'center' },
                    5: { cellWidth: 25, halign: 'center' }
                }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(150);
                doc.text(`Generado: ${new Date().toLocaleDateString('es-ES')}`, 14, doc.internal.pageSize.height - 10);
                doc.text(`Página ${i} de ${pageCount}`, doc.internal.pageSize.width - 30, doc.internal.pageSize.height - 10);
            }

            // Download
            doc.save(`Asistencia_${monthNames[month]}_${year}.pdf`);
        };

        // Alert Detection - Check for excessive absences
        const checkAbsenceAlerts = async () => {
            const settings = await db.settings.get('absenceAlerts');
            if (!settings || !settings.enabled) return;

            const threshold = settings.threshold || 3;
            const students = await db.students.toArray();
            const allClasses = await db.classes.toArray();

            // Get recent classes (last 30 days)
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
            const recentClasses = allClasses.filter(c => new Date(c.date) >= thirtyDaysAgo);

            for (const student of students) {
                let absenceCount = 0;

                recentClasses.forEach(classItem => {
                    if (classItem.attendance && !classItem.attendance.includes(student.id)) {
                        absenceCount++;
                    }
                });

                // Check if alert already exists for this student
                const existingAlert = await db.alerts
                    .where('studentId').equals(student.id)
                    .and(a => !a.acknowledged)
                    .first();

                if (absenceCount >= threshold && !existingAlert) {
                    // Create new alert
                    await db.alerts.add({
                        studentId: student.id,
                        studentName: student.name,
                        absenceCount,
                        date: new Date().toISOString(),
                        acknowledged: false
                    });
                } else if (absenceCount < threshold && existingAlert) {
                    // Remove alert if absences dropped below threshold
                    await db.alerts.delete(existingAlert.id);
                }
            }
        };

        // --- COMPONENTS ---

        // 0. AUTH SCREEN (Login/Signup)
        const AuthScreen = ({ onAuthSuccess }) => {
            const [isLogin, setIsLogin] = useState(true);
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                // Validate email
                if (!isValidEmail(email)) {
                    setError('Por favor usa un correo válido (Gmail, Yahoo, Hotmail, etc.). No se permiten correos temporales.');
                    return;
                }

                if (password.length < 6) {
                    setError('La contraseña debe tener al menos 6 caracteres.');
                    return;
                }

                setLoading(true);
                try {
                    if (isLogin) {
                        await auth.signInWithEmailAndPassword(email, password);
                    } else {
                        await auth.createUserWithEmailAndPassword(email, password);
                    }
                    onAuthSuccess();
                } catch (err) {
                    if (err.code === 'auth/email-already-in-use') {
                        setError('Este correo ya está registrado. Intenta iniciar sesión.');
                    } else if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
                        setError('Correo o contraseña incorrectos.');
                    } else if (err.code === 'auth/invalid-email') {
                        setError('Formato de correo inválido.');
                    } else {
                        setError('Error: ' + err.message);
                    }
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-[430px] mx-auto min-h-screen bg-gradient-to-br from-primary to-blue-600 flex items-center justify-center p-6">
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl shadow-2xl p-8 space-y-6">
                        {/* Logo */}
                        <div className="text-center">
                            <div className="inline-flex items-center justify-center w-16 h-16 bg-primary rounded-2xl mb-4">
                                <span className="material-icons text-white text-3xl">fitness_center</span>
                            </div>
                            <h1 className="text-3xl font-extrabold text-slate-900 dark:text-white">
                                GymCoach <span className="text-primary">Pro</span>
                            </h1>
                            <p className="text-slate-500 dark:text-slate-400 text-sm mt-2">
                                {isLogin ? 'Inicia sesión para continuar' : 'Crea tu cuenta gratuita'}
                            </p>
                        </div>

                        {/* Form */}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">
                                    Correo Electrónico
                                </label>
                                <input
                                    type="email"
                                    value={email}
                                    onChange={(e) => setEmail(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                                    placeholder="tu@email.com"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">
                                    Contraseña
                                </label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all"
                                    placeholder="••••••••"
                                    required
                                />
                            </div>

                            {error && (
                                <div className="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 px-4 py-3 rounded-xl text-sm">
                                    {error}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-primary text-white py-3.5 rounded-xl font-bold shadow-lg shadow-primary/30 hover:bg-blue-600 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                                {loading ? 'Cargando...' : (isLogin ? 'Iniciar Sesión' : 'Crear Cuenta')}
                            </button>
                        </form>

                        {/* Toggle */}
                        <div className="text-center">
                            <button
                                onClick={() => { setIsLogin(!isLogin); setError(''); }}
                                className="text-sm text-slate-600 dark:text-slate-400 hover:text-primary transition-colors"
                            >
                                {isLogin ? '¿No tienes cuenta? ' : '¿Ya tienes cuenta? '}
                                <span className="font-bold text-primary">{isLogin ? 'Regístrate' : 'Inicia Sesión'}</span>
                            </button>
                        </div>

                        {/* Free tier info */}
                        {!isLogin && (
                            <div className="bg-blue-50 dark:bg-blue-900/20 border border-blue-200 dark:border-blue-800 rounded-xl p-4 text-center">
                                <p className="text-xs text-blue-600 dark:text-blue-400 font-medium">
                                    ✨ Versión gratuita: hasta 10 alumnos
                                </p>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // 1. DASHBOARD
        const Dashboard = ({ onStart, onViewStudents, onViewReports, onViewSettings, onViewClass, view }) => {
            const [recentClasses, setRecentClasses] = useState([]);
            const [stats, setStats] = useState({ total: 0, students: 0 });

            useEffect(() => {
                const load = async () => {
                    const classes = await db.classes.reverse().limit(3).toArray();
                    setRecentClasses(classes);
                    const totalClasses = await db.classes.count();
                    const totalStudents = await db.students.count();
                    setStats({ total: totalClasses, students: totalStudents });
                };
                load();
            }, []);

            return (
                <div className="max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 shadow-2xl relative overflow-hidden flex flex-col">
                    {/* Header */}
                    <header className="px-6 py-4 flex justify-between items-center border-b border-slate-100 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-50">
                        <div className="flex items-center gap-2">
                            <div className="bg-primary p-1.5 rounded-lg flex items-center justify-center">
                                <span className="material-icons text-white text-[20px]">fitness_center</span>
                            </div>
                            <h1 className="text-xl font-bold tracking-tight text-slate-900 dark:text-white">GymCoach <span className="text-primary">Pro</span></h1>
                        </div>
                        <button
                            onClick={() => onViewSettings()}
                            className="w-10 h-10 rounded-full bg-primary/10 dark:bg-primary/20 flex items-center justify-center text-primary"
                            title="Mochila de Emergencia (Respaldo)"
                        >
                            <span className="material-icons">backpack</span>
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto px-6 py-6 space-y-6">
                        {/* Hero Greeting Card */}
                        <section className="relative overflow-hidden rounded-2xl bg-gradient-to-br from-primary to-[#60a5fa] p-7 shadow-lg shadow-primary/30">
                            <div className="relative z-10 flex flex-col items-start gap-4">
                                <div>
                                    <h2 className="text-white text-3xl font-extrabold tracking-tight">¡Hola Prof!</h2>
                                    <p className="text-blue-50/90 text-sm font-medium mt-1">Listo para la sesión de hoy.</p>
                                </div>
                                <button onClick={onStart} className="mt-2 flex items-center gap-2 bg-white text-primary px-6 py-3.5 rounded-2xl font-bold shadow-sm active:scale-95 transition-transform">
                                    <span className="material-icons text-[22px]">add_circle</span>
                                    <span>Registrar Clase</span>
                                </button>
                            </div>
                            {/* Abstract Design Elements */}
                            <div className="absolute -right-8 -bottom-8 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
                            <div className="absolute -right-4 top-2 w-20 h-20 bg-white/10 rounded-full blur-xl"></div>
                        </section>

                        {/* Stats Grid */}
                        <section className="grid grid-cols-2 gap-4">
                            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                                <div className="flex items-center gap-2 text-slate-500 dark:text-slate-400 mb-2">
                                    <span className="material-icons text-[20px]">event_available</span>
                                    <span className="text-[10px] font-bold uppercase tracking-widest">Total Clases</span>
                                </div>
                                <div className="text-3xl font-extrabold text-slate-900 dark:text-white">{stats.total || 0}</div>
                                <div className="text-[11px] text-green-500 font-bold mt-1.5 flex items-center gap-1">
                                    <span className="material-icons text-[14px]">trending_up</span> +12% este mes
                                </div>
                            </div>
                            <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                                <div className="flex items-center gap-2 text-slate-500 dark:text-slate-400 mb-2">
                                    <span className="material-icons text-[20px]">group</span>
                                    <span className="text-[10px] font-bold uppercase tracking-widest">Alumnos</span>
                                </div>
                                <div className="text-3xl font-extrabold text-slate-900 dark:text-white">{stats.students || 0}</div>
                                <div className="text-[11px] text-primary font-bold mt-1.5 flex items-center gap-1">
                                    <span className="material-icons text-[14px]">person_add</span> 4 nuevos esta semana
                                </div>
                            </div>
                        </section>

                        <section className="space-y-4">
                            <div className="flex items-center justify-between">
                                <h3 className="text-xl font-extrabold text-slate-900 dark:text-white">Clases Recientes</h3>
                                <button onClick={onViewReports} className="text-sm font-bold text-primary hover:underline transition-all">Ver todas</button>
                            </div>
                            <div className="space-y-3">
                                {recentClasses.length === 0 && (
                                    <div className="py-8 text-center bg-slate-50 dark:bg-slate-800/50 rounded-2xl border-2 border-dashed border-slate-200 dark:border-slate-700">
                                        <p className="text-slate-400 text-sm font-medium italic">No hay clases registradas aún.</p>
                                    </div>
                                )}
                                {recentClasses.map((cls, idx) => {
                                    // Cycle through colors/icons for variety like in Stitch
                                    const icons = ['sports_gymnastics', 'child_care', 'star'];
                                    const colors = ['bg-primary/10 text-primary', 'bg-orange-100 text-orange-500', 'bg-purple-100 text-purple-600'];
                                    const iconIdx = idx % icons.length;

                                    return (
                                        <div
                                            key={cls.id}
                                            onClick={() => onViewClass(cls.id)}
                                            className="flex items-center p-4 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm hover:border-primary/50 transition-all cursor-pointer group active:scale-[0.98]"
                                        >
                                            <div className={`w-12 h-12 rounded-xl flex items-center justify-center mr-4 transition-transform group-hover:scale-105 ${colors[iconIdx]}`}>
                                                <span className="material-icons">{icons[iconIdx]}</span>
                                            </div>
                                            <div className="flex-1">
                                                <h4 className="font-bold text-slate-900 dark:text-white text-base">{cls.groupName}</h4>
                                                <div className="flex items-center gap-4 text-xs text-slate-500 dark:text-slate-400 mt-1">
                                                    <span className="flex items-center gap-1"><span className="material-icons text-[14px]">calendar_today</span> {new Date(cls.date).toLocaleDateString('es-ES', { month: 'short', day: 'numeric', year: 'numeric' })}</span>
                                                    <span className="flex items-center gap-1"><span className="material-icons text-[14px]">groups</span> {cls.attendance?.length || 0} Alumnos</span>
                                                </div>
                                            </div>
                                            <span className="material-icons text-slate-300 group-hover:text-primary transition-colors">chevron_right</span>
                                        </div>
                                    );
                                })}
                            </div>
                        </section>

                        {/* Upcoming Event Card */}
                        <section
                            onClick={() => alert("Próximamente: Gestión de Torneos y Eventos.")}
                            className="bg-slate-900 dark:bg-primary rounded-2xl p-6 text-white flex items-center justify-between shadow-lg cursor-pointer active:scale-[0.98] transition-all group"
                        >
                            <div>
                                <span className="text-[10px] font-black uppercase tracking-widest text-slate-400 dark:text-blue-100 opacity-80">Próximo Torneo</span>
                                <p className="text-base font-bold mt-1 group-hover:text-blue-200 transition-colors">Copa Regional de Invierno</p>
                            </div>
                            <div className="bg-white/20 px-4 py-1.5 rounded-full text-xs font-bold backdrop-blur-md border border-white/10 flex items-center gap-1">
                                <span className="material-icons text-[14px]">timer</span>
                                Faltan 5 días
                            </div>
                        </section>
                    </main>

                    <nav className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800 px-8 py-4 flex justify-between items-center pb-8 sticky bottom-0 z-50">
                        <button onClick={() => { }} className={`flex flex-col items-center gap-1.5 ${view === 'dashboard' ? 'text-primary scale-110' : 'text-slate-400 dark:text-slate-500 hover:text-primary'}`}>
                            <span className="material-icons">grid_view</span>
                            <span className="text-[10px] font-bold">Dashboard</span>
                        </button>
                        <button
                            onClick={() => alert("Próximamente: Consulta de horarios por grupo.")}
                            className="flex flex-col items-center gap-1.5 text-slate-400 dark:text-slate-500 hover:text-primary transition-colors"
                        >
                            <span className="material-icons text-[22px]">calendar_month</span>
                            <span className="text-[10px] font-bold uppercase tracking-tight">Horario</span>
                        </button>
                        <button onClick={onViewStudents} className={`flex flex-col items-center gap-1.5 ${view === 'students' ? 'text-primary scale-110' : 'text-slate-400 dark:text-slate-500 hover:text-primary'}`}>
                            <span className="material-icons">groups</span>
                            <span className="text-[10px] font-bold uppercase tracking-tight">Alumnos</span>
                        </button>
                        <button onClick={onViewReports} className={`flex flex-col items-center gap-1.5 ${view === 'reports' ? 'text-primary scale-110' : 'text-slate-400 dark:text-slate-500 hover:text-primary'}`}>
                            <span className="material-icons text-[22px]">analytics</span>
                            <span className="text-[10px] font-bold uppercase tracking-tight">Reportes</span>
                        </button>
                    </nav>

                    {/* iOS Home Indicator */}
                    <div className="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full opacity-50"></div>
                </div>
            );
        };

        // 2. STUDENTS LIST
        const StudentsList = ({ onBack, onSelectStudent }) => {
            const [students, setStudents] = useState([]);
            const [search, setSearch] = useState("");
            const [showAddModal, setShowAddModal] = useState(false);
            const [showUpgradeModal, setShowUpgradeModal] = useState(false);
            const [newStudent, setNewStudent] = useState({ name: '', dob: '', dni: '' });

            useEffect(() => {
                db.students.toArray().then(setStudents);
            }, []);

            const filteredStudents = students.filter(s =>
                s.name.toLowerCase().includes(search.toLowerCase())
            );

            const handleAdd = async () => {
                if (!newStudent.name) return;

                // FREEMIUM LOGIC: Check 10-student limit
                if (students.length >= 10) {
                    setShowAddModal(false);
                    setShowUpgradeModal(true);
                    return;
                }

                const category = calculateSportCategory(newStudent.dob);
                const registrationDate = new Date().toISOString().split('T')[0];
                const id = await db.students.add({ ...newStudent, category, active: 1, registrationDate });
                setStudents(prev => [...prev, { ...newStudent, category, active: 1, id, registrationDate }]);
                setShowAddModal(false);
                setNewStudent({ name: '', dob: '', dni: '' });
            };

            const handleDelete = async (id) => {
                if (confirm("¿Eliminar alumno?")) {
                    await db.students.delete(id);
                    setStudents(prev => prev.filter(s => s.id !== id));
                }
            };

            return (
                <div className="max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 shadow-2xl flex flex-col relative overflow-hidden">
                    {/* Header (iOS Style) */}
                    <header className="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 pt-12 pb-4 flex items-center justify-between border-b border-slate-100 dark:border-slate-800">
                        <button onClick={onBack} className="p-2 -ml-2 text-primary hover:bg-primary/10 rounded-full transition-colors">
                            <span className="material-icons-round text-2xl">chevron_left</span>
                        </button>
                        <h1 className="text-lg font-semibold text-slate-800 dark:text-white">Alumnos</h1>
                        <button onClick={() => setShowAddModal(true)} className="p-2 -mr-2 text-primary hover:bg-primary/10 rounded-full transition-colors">
                            <span className="material-icons-round text-2xl">person_add_alt</span>
                        </button>
                    </header>

                    {/* Search Bar Section */}
                    <div className="px-4 py-4 bg-white dark:bg-slate-900">
                        <div className="relative group">
                            <span className="absolute inset-y-0 left-3 flex items-center text-slate-400 group-focus-within:text-primary transition-colors">
                                <span className="material-icons-round text-xl">search</span>
                            </span>
                            <input
                                value={search}
                                onChange={e => setSearch(e.target.value)}
                                className="w-full bg-slate-100 dark:bg-slate-800 border-none rounded-xl py-3 pl-10 pr-4 text-sm focus:ring-2 focus:ring-primary/50 placeholder-slate-400 dark:placeholder-slate-500 transition-all"
                                placeholder="Buscar alumno..."
                                type="text"
                            />
                        </div>
                    </div>

                    {/* Scrollable Student List */}
                    <main className="flex-1 overflow-y-auto px-4 pb-32 hide-scrollbar">
                        <div className="space-y-3 pt-2">
                            {filteredStudents.length === 0 && <p className="text-center text-slate-400 py-10 italic">No hay alumnos que coincidan.</p>}
                            {filteredStudents.map(s => (
                                <div key={s.id} className="bg-white dark:bg-slate-800 p-4 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700 flex items-center gap-4 group active:scale-[0.98] transition-all">
                                    <div className="w-12 h-12 rounded-full overflow-hidden bg-primary/10 flex-shrink-0 flex items-center justify-center text-primary font-bold text-xl uppercase">
                                        {s.name.charAt(0)}
                                    </div>
                                    <div onClick={() => onSelectStudent(s.id)} className="flex-1 cursor-pointer">
                                        <h3 className="font-semibold text-slate-800 dark:text-slate-100">{s.name}</h3>
                                        <div className="flex items-center text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                                            <span>{calculateAge(s.dob)} años</span>
                                            <span className="mx-1.5 opacity-30">•</span>
                                            <span className="px-2 py-0.5 bg-primary/10 text-primary rounded-full font-medium">{s.category}</span>
                                        </div>
                                    </div>
                                    <button onClick={(e) => { e.stopPropagation(); handleDelete(s.id); }} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                                        <span className="material-icons-round text-lg">delete</span>
                                    </button>
                                </div>
                            ))}
                            {/* End of list padding */}
                            <div className="h-20 flex items-center justify-center">
                                <span className="text-xs text-slate-400 uppercase tracking-widest font-medium">Fin de la lista</span>
                            </div>
                        </div>
                    </main>

                    {/* Floating Action Button */}
                    <button onClick={() => setShowAddModal(true)} className="absolute bottom-24 right-6 w-14 h-14 bg-primary text-white rounded-full shadow-lg shadow-primary/40 flex items-center justify-center hover:scale-105 active:scale-95 transition-all z-40">
                        <span className="material-icons-round text-3xl">add</span>
                    </button>

                    {/* Navigation Bar (iOS Tab Bar) */}
                    <nav className="absolute bottom-0 inset-x-0 h-20 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 flex items-start justify-around px-2 pt-2 z-50">
                        <button onClick={onBack} className="flex flex-col items-center gap-1 w-1/4 pt-1 text-slate-400 dark:text-slate-500">
                            <span className="material-icons-round text-[24px]">home</span>
                            <span className="text-[10px] font-medium">Inicio</span>
                        </button>
                        <button onClick={() => { }} className="flex flex-col items-center gap-1 w-1/4 pt-1 text-primary">
                            <span className="material-icons-round text-[24px]">groups</span>
                            <span className="text-[10px] font-medium">Alumnos</span>
                        </button>
                        <button className="flex flex-col items-center gap-1 w-1/4 pt-1 text-slate-400 dark:text-slate-500">
                            <span className="material-icons-round text-[24px]">event_note</span>
                            <span className="text-[10px] font-medium">Clases</span>
                        </button>
                        <button className="flex flex-col items-center gap-1 w-1/4 pt-1 text-slate-400 dark:text-slate-500">
                            <span className="material-icons-round text-[24px]">analytics</span>
                            <span className="text-[10px] font-medium">Reportes</span>
                        </button>
                    </nav>

                    {/* Add Modal */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-6 w-full max-w-sm shadow-2xl">
                                <h3 className="text-lg font-bold mb-4 dark:text-white">Nuevo Alumno</h3>
                                <div className="space-y-4">
                                    <div>
                                        <label className="text-xs font-semibold text-slate-500 uppercase">Nombre Completo</label>
                                        <input className="w-full mt-1 p-3 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:border-primary" placeholder="Ej: Sofía García" value={newStudent.name} onChange={e => setNewStudent({ ...newStudent, name: e.target.value })} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-semibold text-slate-500 uppercase">Fecha de Nacimiento</label>
                                        <input className="w-full mt-1 p-3 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-xl outline-none focus:border-primary" type="date" value={newStudent.dob} onChange={e => setNewStudent({ ...newStudent, dob: e.target.value })} />
                                    </div>
                                </div>
                                <div className="flex gap-3 mt-8">
                                    <button onClick={() => setShowAddModal(false)} className="flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl font-bold">Cancelar</button>
                                    <button onClick={handleAdd} className="flex-1 py-3 bg-primary text-white rounded-xl font-bold">Guardar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Upgrade Modal (Freemium) */}
                    {showUpgradeModal && (
                        <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4">
                            <div className="bg-white dark:bg-slate-800 rounded-3xl p-8 w-full max-w-sm shadow-2xl text-center">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-amber-400 to-orange-500 rounded-2xl mb-4">
                                    <span className="material-icons text-white text-3xl">workspace_premium</span>
                                </div>
                                <h3 className="text-2xl font-extrabold mb-2 dark:text-white">¡Límite Alcanzado!</h3>
                                <p className="text-slate-600 dark:text-slate-400 mb-6">
                                    Has llegado al límite de <span className="font-bold text-primary">10 alumnos</span> de la versión gratuita.
                                </p>
                                <div className="bg-gradient-to-r from-primary/10 to-purple-500/10 border border-primary/20 rounded-2xl p-4 mb-6">
                                    <p className="text-sm font-bold text-primary mb-2">✨ Actualiza a Pro y obtén:</p>
                                    <ul className="text-xs text-slate-600 dark:text-slate-400 space-y-1 text-left">
                                        <li>✓ Alumnos ilimitados</li>
                                        <li>✓ Reportes completos y analíticas</li>
                                        <li>✓ Exportación de datos (Excel)</li>
                                        <li>✓ Sincronización en la nube</li>
                                    </ul>
                                </div>
                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setShowUpgradeModal(false)}
                                        className="flex-1 py-3 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 rounded-xl font-bold"
                                    >
                                        Cerrar
                                    </button>
                                    <button
                                        onClick={() => alert('Próximamente: Actualización a Pro')}
                                        className="flex-1 py-3 bg-gradient-to-r from-primary to-purple-600 text-white rounded-xl font-bold shadow-lg"
                                    >
                                        Actualizar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Bottom Safe Area Indicator (Visual only) */}
                    <div className="absolute bottom-1.5 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full z-[60]"></div>
                </div>
            );
        };

        // 2.5 REPORTS & STATISTICS
        const Reports = ({ onBack, onViewDashboard, onViewStudents, onViewAttendanceReport, view }) => {
            const [stats, setStats] = useState({ total: 0, attendance: 0, achievements: 0 });
            const [recentClasses, setRecentClasses] = useState([]);

            useEffect(() => {
                const load = async () => {
                    const totalClasses = await db.classes.count();
                    const allClasses = await db.classes.toArray();
                    const totalStudents = await db.students.count();
                    const classes = await db.classes.reverse().limit(4).toArray();

                    // Real attendance average
                    let avgAtt = 0;
                    if (totalClasses > 0) {
                        const sum = allClasses.reduce((acc, c) => acc + (c.attendance?.length || 0), 0);
                        avgAtt = Math.round((sum / (totalClasses * (totalStudents || 1))) * 100);
                    }

                    setRecentClasses(classes);
                    setStats({ total: totalClasses, attendance: avgAtt, achievements: totalClasses * 2 });
                };
                load();
            }, []);

            return (
                <div className="max-w-[430px] mx-auto bg-white dark:bg-background-dark min-h-screen shadow-2xl pb-24 relative overflow-hidden flex flex-col">
                    <header className="flex items-center px-4 py-4 sticky top-0 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md z-10 border-b border-slate-100 dark:border-slate-800">
                        <button onClick={onBack} className="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            <span className="material-icons text-primary">arrow_back_ios_new</span>
                        </button>
                        <h1 className="flex-1 text-center text-lg font-bold mr-10 dark:text-white">Reportes y Estadísticas</h1>
                    </header>

                    <main className="flex-1 px-5 space-y-8 mt-4 overflow-y-auto hide-scrollbar">
                        <section className="grid grid-cols-3 gap-3">
                            <div className="bg-primary/10 dark:bg-primary/20 p-4 rounded-xl flex flex-col items-center text-center">
                                <span className="material-icons text-primary mb-2">event_available</span>
                                <span className="text-2xl font-bold text-primary">{stats.total}</span>
                                <span className="text-[10px] uppercase font-bold text-primary/70 tracking-tight">Clases Totales</span>
                            </div>
                            <div className="bg-primary/10 dark:bg-primary/20 p-4 rounded-xl flex flex-col items-center text-center">
                                <span className="material-icons text-primary mb-2">groups</span>
                                <span className="text-2xl font-bold text-primary">{stats.attendance}%</span>
                                <span className="text-[10px] uppercase font-bold text-primary/70 tracking-tight">Asistencia</span>
                            </div>
                            <div className="bg-primary/10 dark:bg-primary/20 p-4 rounded-xl flex flex-col items-center text-center">
                                <span className="material-icons text-primary mb-2">emoji_events</span>
                                <span className="text-2xl font-bold text-primary">{stats.achievements}</span>
                                <span className="text-[10px] uppercase font-bold text-primary/70 tracking-tight">Logros</span>
                            </div>
                        </section>

                        <section className="bg-slate-50 dark:bg-slate-800/50 p-5 rounded-2xl border border-slate-100 dark:border-slate-700">
                            <div className="flex justify-between items-end mb-6">
                                <div>
                                    <h2 className="text-sm font-bold dark:text-white">Tendencias de Asistencia</h2>
                                    <p className="text-xs text-slate-500 dark:text-slate-400">Últimas {recentClasses.length} sesiones</p>
                                </div>
                            </div>
                            <div className="flex items-end justify-between h-40 gap-3 px-2 border-b border-slate-200 dark:border-slate-700 relative">
                                {recentClasses.map((cls, idx) => (
                                    <div key={cls.id} className="flex-1 flex flex-col-reverse items-center h-full">
                                        <div className="w-full bg-primary rounded-t-lg transition-all duration-500" style={{ height: `${(cls.attendance?.length || 0) * 10}%`, minHeight: '10%' }}></div>
                                        <span className="text-[8px] font-bold text-slate-400 mt-2 rotate-45 mb-4">{new Date(cls.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</span>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="space-y-4">
                            <h2 className="text-sm font-bold uppercase tracking-wider text-slate-400">Habilidades más practicadas</h2>
                            <div className="space-y-5">
                                {[
                                    { label: 'Viga de Equilibrio', p: 85 },
                                    { label: 'Flic Flac (Atrás)', p: 62 },
                                    { label: 'Salto de Potro', p: 48 }
                                ].map(skill => (
                                    <div key={skill.label} className="space-y-2">
                                        <div className="flex justify-between items-center text-xs font-bold dark:text-slate-300">
                                            <span>{skill.label}</span>
                                            <span className="text-primary">{skill.p}%</span>
                                        </div>
                                        <div className="w-full bg-slate-100 dark:bg-slate-800 h-2.5 rounded-full overflow-hidden">
                                            <div className="bg-primary h-full rounded-full transition-all duration-1000" style={{ width: `${skill.p}%` }}></div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="pt-2">
                            <button
                                onClick={() => onViewAttendanceReport()}
                                className="w-full bg-slate-900 dark:bg-primary p-6 rounded-2xl text-white flex items-center justify-between shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-[0.98] transition-all"
                            >
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-white/20 rounded-xl flex items-center justify-center">
                                        <span className="material-icons">assignment_turned_in</span>
                                    </div>
                                    <div className="text-left">
                                        <h3 className="font-bold text-lg">Asistencia y Planillas</h3>
                                        <p className="text-xs text-white/70">Control de presentismo por alumno</p>
                                    </div>
                                </div>
                                <span className="material-icons">chevron_right</span>
                            </button>
                        </section>
                    </main>

                    <nav className="bg-white/80 dark:bg-slate-900/80 backdrop-blur-lg border-t border-slate-100 dark:border-slate-800 px-8 py-4 flex justify-between items-center pb-8 sticky bottom-0 z-50">
                        <button onClick={onViewDashboard} className="flex flex-col items-center gap-1.5 text-slate-400">
                            <span className="material-icons">grid_view</span>
                            <span className="text-[10px] font-bold">Dashboard</span>
                        </button>
                        <button
                            onClick={() => alert("Próximamente: Consulta de horarios por grupo.")}
                            className="flex flex-col items-center gap-1.5 text-slate-400"
                        >
                            <span className="material-icons text-[22px]">calendar_month</span>
                            <span className="text-[10px] font-bold uppercase tracking-tight">Horario</span>
                        </button>
                        <button onClick={onViewStudents} className="flex flex-col items-center gap-1.5 text-slate-400">
                            <span className="material-icons text-[22px]">groups</span>
                            <span className="text-[10px] font-bold uppercase tracking-tight">Alumnos</span>
                        </button>
                        <button className="flex flex-col items-center gap-1.5 text-primary scale-110">
                            <span className="material-icons text-[22px]">analytics</span>
                            <span className="text-[10px] font-bold uppercase tracking-tight">Reportes</span>
                        </button>
                    </nav>
                </div>
            );
        };

        // 2.6 STUDENT DETAIL
        const StudentDetail = ({ studentId, onBack }) => {
            const [student, setStudent] = useState(null);
            const [isEditing, setIsEditing] = useState(false);
            const [editData, setEditData] = useState({ name: '', dob: '' });
            const [notes, setNotes] = useState("");
            const [isSaving, setIsSaving] = useState(false);

            useEffect(() => {
                db.students.get(studentId).then(s => {
                    setStudent(s);
                    setEditData({ name: s.name, dob: s.dob });
                    setNotes(s.notes || "");
                });
            }, [studentId]);

            const handleUpdateInfo = async () => {
                const category = calculateSportCategory(editData.dob);
                await db.students.update(studentId, { ...editData, category });
                const updated = await db.students.get(studentId);
                setStudent(updated);
                setIsEditing(false);
            };

            const handleSaveNote = async () => {
                setIsSaving(true);
                await db.students.update(studentId, { notes });
                setTimeout(() => setIsSaving(false), 500);
            };

            if (!student) return null;

            return (
                <div className="max-w-[430px] mx-auto min-h-screen bg-background-light dark:bg-background-dark pb-12 shadow-2xl relative flex flex-col">
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 h-16 flex items-center justify-between">
                        <button onClick={onBack} className="flex items-center text-primary">
                            <span className="material-icons">chevron_left</span>
                            <span className="text-lg font-medium">Atrás</span>
                        </button>
                        <h1 className="text-lg font-bold absolute left-1/2 -translate-x-1/2 dark:text-white truncate max-w-[150px]">{student.name}</h1>
                        <button onClick={() => setIsEditing(!isEditing)} className="text-primary hover:bg-primary/10 p-2 rounded-full transition-colors">
                            <span className="material-icons">{isEditing ? 'close' : 'edit'}</span>
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto hide-scrollbar">
                        <section className="p-6">
                            {isEditing ? (
                                <div className="space-y-4 bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest">Nombre</label>
                                        <input
                                            className="w-full mt-1 p-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg outline-none focus:border-primary dark:text-white"
                                            value={editData.name}
                                            onChange={e => setEditData({ ...editData, name: e.target.value })}
                                        />
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold uppercase text-slate-400 tracking-widest">Fecha Nacimiento</label>
                                        <input
                                            type="date"
                                            className="w-full mt-1 p-2.5 bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg outline-none focus:border-primary dark:text-white"
                                            value={editData.dob}
                                            onChange={e => setEditData({ ...editData, dob: e.target.value })}
                                        />
                                    </div>
                                    <button onClick={handleUpdateInfo} className="w-full bg-primary text-white py-3 rounded-xl font-bold shadow-lg shadow-primary/20">Guardar Cambios</button>
                                </div>
                            ) : (
                                <div className="flex items-center gap-5">
                                    <div className="w-24 h-24 rounded-full bg-primary flex items-center justify-center text-white text-3xl font-bold border-4 border-white dark:border-slate-800 shadow-lg shrink-0">
                                        {student.name.charAt(0)}{student.name.split(' ')[1]?.charAt(0) || ''}
                                    </div>
                                    <div className="space-y-1 overflow-hidden">
                                        <h2 className="text-2xl font-bold tracking-tight dark:text-white truncate">{student.name}</h2>
                                        <div className="flex flex-col gap-1">
                                            <span className="inline-flex items-center text-sm font-medium text-slate-500 dark:text-slate-400">
                                                <span className="material-icons text-sm mr-1">emoji_events</span> {student.category}
                                            </span>
                                            <span className="inline-flex items-center text-sm font-medium text-slate-500 dark:text-slate-400">
                                                <span className="material-icons text-sm mr-1">cake</span> {calculateAge(student.dob)} años
                                            </span>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </section>

                        <section className="px-6 py-4 space-y-4">
                            <h3 className="text-lg font-bold dark:text-white">Progresos por Aparato</h3>
                            {[
                                { name: 'Viga', icon: 'horizontal_rule', p: 85 },
                                { name: 'Suelo', icon: 'grid_view', p: 45 },
                                { name: 'Salto', icon: 'bolt', p: 82 },
                                { name: 'Paralelas', icon: 'reorder', p: 30 }
                            ].map(ap => (
                                <div key={ap.name} className="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm border border-slate-100 dark:border-slate-700 flex items-center justify-between">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-lg bg-primary/10 flex items-center justify-center text-primary">
                                            <span className="material-icons">{ap.icon}</span>
                                        </div>
                                        <span className="font-bold text-lg dark:text-slate-200">{ap.name}</span>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <span className="text-sm font-bold text-primary">{ap.p}%</span>
                                        <span className="material-icons text-slate-300">chevron_right</span>
                                    </div>
                                </div>
                            ))}
                        </section>

                        <section className="px-6 py-4">
                            <h3 className="text-lg font-bold mb-4 dark:text-white">Notas del Entrenador</h3>
                            <div className="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-lg border border-slate-100 dark:border-slate-700">
                                <textarea
                                    className="w-full bg-transparent border-none focus:ring-0 text-slate-600 dark:text-slate-300 text-sm leading-relaxed resize-none p-0"
                                    placeholder="Escribe tus observaciones aquí..."
                                    rows="4"
                                    value={notes}
                                    onChange={e => setNotes(e.target.value)}
                                ></textarea>
                                <div className="mt-3 flex justify-end">
                                    <button
                                        onClick={handleSaveNote}
                                        className={`px-6 py-2.5 rounded-xl font-bold text-sm shadow-md transition-all ${isSaving ? 'bg-green-500 text-white' : 'bg-primary text-white shadow-primary/20 hover:scale-105 active:scale-95'}`}
                                    >
                                        {isSaving ? 'Guardado!' : 'Guardar Nota'}
                                    </button>
                                </div>
                            </div>
                        </section>
                    </main>
                    <div className="h-6 shrink-0 flex justify-center items-center">
                        <div className="w-32 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full opacity-50"></div>
                    </div>
                </div>
            );
        };

        // 2.8 CLASS DETAIL
        const ClassDetail = ({ classId, onBack }) => {
            const [cls, setCls] = useState(null);
            const [attendees, setAttendees] = useState([]);

            useEffect(() => {
                const load = async () => {
                    const c = await db.classes.get(classId);
                    if (c) {
                        setCls(c);
                        const students = await db.students.bulkGet(c.attendance || []);
                        setAttendees(students.filter(Boolean));
                    }
                };
                load();
            }, [classId]);

            if (!cls) return null;

            return (
                <div className="max-w-[430px] mx-auto min-h-screen bg-slate-50 dark:bg-slate-900 pb-12 shadow-2xl relative flex flex-col">
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 h-16 flex items-center gap-4">
                        <button onClick={onBack} className="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                            <span className="material-icons text-primary">arrow_back_ios_new</span>
                        </button>
                        <h1 className="text-xl font-bold dark:text-white truncate">Detalle de Clase</h1>
                    </header>

                    <main className="flex-1 p-6 space-y-6 overflow-y-auto">
                        <div className="bg-primary rounded-2xl p-6 text-white shadow-lg">
                            <h2 className="text-2xl font-black">{cls.groupName}</h2>
                            <p className="text-blue-100 text-sm mt-1">{new Date(cls.date).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</p>
                            <div className="flex items-center gap-2 mt-4 bg-white/20 w-fit px-3 py-1 rounded-full text-xs font-bold">
                                <span className="material-icons text-sm">person</span>
                                {cls.coachName}
                            </div>
                        </div>

                        <section className="space-y-3">
                            <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Entrada en Calor</h3>
                            <div className="flex flex-wrap gap-2">
                                {(cls.warmup || []).map(w => (
                                    <span key={w} className="px-4 py-2 bg-white dark:bg-slate-800 rounded-full border border-slate-200 dark:border-slate-700 text-sm font-bold shadow-sm">{w}</span>
                                ))}
                                {(cls.warmup || []).length === 0 && <p className="text-sm italic text-slate-400">No especificado</p>}
                            </div>
                        </section>

                        <section className="space-y-4">
                            <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Aparatos y Habilidades</h3>
                            <div className="grid grid-cols-1 gap-4">
                                {(cls.apparatus || []).map(ap => (
                                    <div key={ap} className="bg-white dark:bg-slate-800 p-5 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm">
                                        <div className="flex items-center gap-3 mb-3">
                                            <div className="w-10 h-10 bg-primary/10 rounded-lg flex items-center justify-center text-primary font-black uppercase text-xs">
                                                {ap.substring(0, 2)}
                                            </div>
                                            <h4 className="font-bold text-slate-800 dark:text-white capitalize">{ap}</h4>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {(cls.skills?.[ap] || []).map(sk => (
                                                <span key={sk} className="text-xs font-medium px-3 py-1 bg-slate-50 dark:bg-slate-700/50 rounded-lg text-slate-600 dark:text-slate-300">
                                                    {sk}
                                                </span>
                                            ))}
                                            {(cls.skills?.[ap] || []).length === 0 && <p className="text-[10px] text-slate-400 italic">Sin habilidades registradas</p>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        <section className="space-y-3">
                            <h3 className="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Presentes ({attendees.length})</h3>
                            <div className="space-y-2">
                                {attendees.map(s => (
                                    <div key={s.id} className="flex items-center gap-3 p-3 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700 shadow-sm">
                                        <div className="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary text-[10px] font-bold">
                                            {s.name.charAt(0)}
                                        </div>
                                        <span className="text-sm font-bold text-slate-700 dark:text-slate-200">{s.name}</span>
                                    </div>
                                ))}
                            </div>
                        </section>
                    </main>
                </div>
            );
        };

        // 2.9 ATTENDANCE GENERATOR (PLANILLAS)
        const AttendanceReport = ({ onBack }) => {
            const [report, setReport] = useState([]);
            const [classes, setClasses] = useState([]);

            useEffect(() => {
                const load = async () => {
                    const students = await db.students.toArray();
                    const allClasses = await db.classes.toArray();
                    setClasses(allClasses);

                    const data = students.map(s => {
                        const regDate = s.registrationDate || (allClasses[0]?.date) || new Date().toISOString();
                        const possibleClasses = allClasses.filter(c => c.date >= regDate);
                        const attendances = allClasses.filter(c => (c.attendance || []).includes(s.id));

                        return {
                            ...s,
                            count: attendances.length,
                            total: possibleClasses.length,
                            percent: possibleClasses.length > 0 ? Math.round((attendances.length / possibleClasses.length) * 100) : 0
                        };
                    });
                    setReport(data.sort((a, b) => b.percent - a.percent));
                };
                load();
            }, []);

            return (
                <div className="max-w-[430px] mx-auto min-h-screen bg-white dark:bg-slate-900 pb-12 shadow-2xl relative flex flex-col print:max-w-none print:shadow-none print:bg-white">
                    <header className="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-6 h-16 flex items-center justify-between print:hidden">
                        <div className="flex items-center gap-4">
                            <button onClick={onBack} className="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                                <span className="material-icons text-primary">arrow_back_ios_new</span>
                            </button>
                            <h1 className="text-xl font-bold dark:text-white">Asistencia y Planillas</h1>
                        </div>
                        <button onClick={() => window.print()} className="bg-primary/10 text-primary p-2 rounded-xl">
                            <span className="material-icons">print</span>
                        </button>
                    </header>

                    <main className="flex-1 p-6 space-y-6">
                        <div className="bg-slate-900 rounded-2xl p-6 text-white shadow-lg print:bg-white print:text-black print:p-0 print:shadow-none print:border-b-2 print:border-slate-800">
                            <h2 className="text-2xl font-black">Reporte de Presentismo</h2>
                            <p className="text-slate-400 text-xs mt-1 print:text-slate-600">Alumnos Activos • {new Date().toLocaleDateString()}</p>
                            <div className="grid grid-cols-2 gap-4 mt-6 print:hidden">
                                <div className="bg-white/10 p-4 rounded-xl">
                                    <p className="text-[10px] uppercase font-bold text-slate-400">Total Alumnos</p>
                                    <p className="text-2xl font-black">{report.length}</p>
                                </div>
                                <div className="bg-white/10 p-4 rounded-xl">
                                    <p className="text-[10px] uppercase font-bold text-slate-400">Total Clases</p>
                                    <p className="text-2xl font-black">{classes.length}</p>
                                </div>
                            </div>
                        </div>

                        <div className="space-y-3">
                            {report.map(s => (
                                <div key={s.id} className="bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex items-center justify-between print:border-b print:rounded-none print:px-0">
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 bg-slate-50 dark:bg-slate-700/50 rounded-full flex items-center justify-center overflow-hidden border-2 border-white dark:border-slate-800 shadow-sm print:hidden">
                                            <span className="text-xs font-bold text-slate-400">{s.name.charAt(0)}</span>
                                        </div>
                                        <div>
                                            <p className="font-bold text-slate-900 dark:text-white">{s.name}</p>
                                            <p className="text-[10px] text-slate-400 uppercase font-black">{s.category}</p>
                                        </div>
                                    </div>
                                    <div className="text-right">
                                        <div className="flex items-center gap-2 justify-end">
                                            <span className={`text-base font-black ${s.percent > 75 ? 'text-green-500' : s.percent > 50 ? 'text-orange-500' : 'text-red-500'}`}>
                                                {s.percent}%
                                            </span>
                                            <span className="text-[10px] font-bold text-slate-400">({s.count}/{s.total})</span>
                                        </div>
                                        <div className="w-24 h-1 bg-slate-100 dark:bg-slate-700 rounded-full mt-1 overflow-hidden print:hidden">
                                            <div className={`h-full rounded-full ${s.percent > 75 ? 'bg-green-500' : s.percent > 50 ? 'bg-orange-500' : 'bg-red-500'}`} style={{ width: `${s.percent}%` }}></div>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </main>

                    <style dangerouslySetInnerHTML={{
                        __html: `
                        @media print {
                            body * { visibility: hidden; }
                            main, main * { visibility: visible; }
                            main { position: absolute; left: 0; top: 0; width: 100%; padding: 0 !important; margin: 0 !important; }
                            .print\\:hidden { display: none !important; }
                            .shadow-2xl, .shadow-sm, .shadow-lg { box-shadow: none !important; }
                            .bg-slate-900 { background: white !important; color: black !important; }
                            .dark\\:bg-slate-800 { background: white !important; }
                            .rounded-2xl { border-radius: 0 !important; }
                            .border { border: none !important; border-bottom: 1px solid #eee !important; }
                        }
                    `}} />
                </div>
            );
        };

        // 3. WIZARD STEPS
        const Step1Setup = ({ data, updateData, onNext, onCancel }) => {
            const [coaches, setCoaches] = useState([]);
            const [groups, setGroups] = useState([]);

            useEffect(() => {
