<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GymCoach Pro - Sistema Elite v11.0</title>
    
    <!-- Librerías Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@1.41.0",
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            font-size: 1.1rem;
            line-height: 1.6;
            letter-spacing: 0.025em;
        }
        .animate-fadeIn { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .circle-check {
            width: 32px; height: 32px; border-radius: 50%;
            border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .circle-check.active {
            background-color: #4f46e5; border-color: #4f46e5; transform: scale(1.1);
        }
        
        .trash-btn { opacity: 0; transition: all 0.2s; }
        .group:hover .trash-btn { opacity: 1; }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }

        input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }
        
        .editable-item { cursor: pointer; transition: transform 0.2s; }
        .editable-item:hover { transform: translateY(-2px); }
        
        .badge-edit-input {
            background: transparent;
            border: none;
            color: inherit;
            font-weight: inherit;
            width: auto;
            min-width: 50px;
            outline: none;
        }

        .apparatus-grid-item {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import { GoogleGenAI } from "@google/genai";
      const { useState, useEffect, useMemo, useRef } = React;

      const UnevenBarsIcon = ({ active }) => (
        <svg width="60" height="60" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="20" y="50" width="160" height="6" fill={active ? "#FFF" : "#2D3748"} rx="3"/>
          <rect x="20" y="140" width="160" height="6" fill={active ? "#FFF" : "#2D3748"} rx="3"/>
          <rect x="30" y="56" width="6" height="130" fill={active ? "#FFF" : "#2D3748"} rx="3"/>
          <rect x="164" y="56" width="6" height="130" fill={active ? "#FFF" : "#2D3748"} rx="3"/>
          <circle cx="100" cy="35" r="18" fill={active ? "#FFF" : "#4F46E5"} />
          <path d="M100 55 C120 55 135 75 160 115 L145 125 C125 95 110 85 100 85 C90 85 75 95 55 125 L40 115 C65 75 80 55 100 55 Z" fill={active ? "#FFF" : "#4F46E5"} />
          <path d="M100 85 L120 120 H80 L100 85 Z" fill={active ? "#FFF" : "#4F46E5"} />
        </svg>
      );

      const EditableBadge = ({ value, isSelected, onSelect, onUpdate, onDelete, colorClass = "indigo" }) => {
        const [isEditing, setIsEditing] = useState(false);
        const [tempValue, setTempValue] = useState(value);
        const inputRef = useRef(null);

        useEffect(() => {
          if (isEditing) inputRef.current?.focus();
        }, [isEditing]);

        const handleBlur = () => {
          setIsEditing(false);
          if (tempValue.trim() && tempValue !== value) onUpdate(tempValue);
        };

        const handleKeyDown = (e) => {
          if (e.key === 'Enter') handleBlur();
          if (e.key === 'Escape') { setIsEditing(false); setTempValue(value); }
        };

        return (
          <div className="group relative">
            <div 
              onDoubleClick={(e) => { e.stopPropagation(); setIsEditing(true); }}
              onClick={(e) => { if (!isEditing) onSelect(); }}
              className={`px-5 py-3 rounded-full text-[13px] font-bold border-2 transition-all flex items-center gap-3 editable-item shadow-sm
                ${isSelected 
                  ? `bg-${colorClass}-600 text-white border-${colorClass}-600` 
                  : `bg-white text-slate-500 border-slate-100 hover:border-${colorClass}-200`}`}
            >
              {isEditing ? (
                <input
                  ref={inputRef}
                  className="badge-edit-input bg-transparent border-none text-white outline-none"
                  value={tempValue}
                  onChange={(e) => setTempValue(e.target.value)}
                  onBlur={handleBlur}
                  onKeyDown={handleKeyDown}
                  onClick={(e) => e.stopPropagation()}
                />
              ) : (
                <span>{value}</span>
              )}
            </div>
            {!isEditing && (
              <button 
                onClick={(e) => { e.stopPropagation(); onDelete(); }}
                className="trash-btn absolute -top-2 -right-2 w-6 h-6 bg-red-500 text-white rounded-full flex items-center justify-center text-[10px] shadow-lg hover:scale-110"
              >
                <i className="fas fa-trash"></i>
              </button>
            )}
          </div>
        );
      };

      const Step = {
        MainInfo: 0, AgeGroup: 1, Attendance: 2, Warmup: 3, 
        ApparatusSelect: 4, ApparatusDetail: 5, Summary: 6, Success: 7
      };

      const DAYS = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
      const TIMES = ['17:00', '17:30', '18:00', '18:30', '19:00', '19:30', '20:00'];
      const APPARATUS_OPTIONS = ['Viga de equilibrio', 'Paralelas asimétricas', 'Suelo', 'Salto'];
      const AGE_GROUPS_LIST = ['3 a 5 años', '6 a 9 años', '10 a 15 años'];

      const App = () => {
        const [viewMode, setViewMode] = useState('Registro');
        const [currentStep, setCurrentStep] = useState(Step.MainInfo);
        const [history, setHistory] = useState([]);
        const [isSaving, setIsSaving] = useState(false);

        const [coaches, setCoaches] = useState(() => JSON.parse(localStorage.getItem('coaches_v11')) || ['Prof. José', 'Prof. Ana']);
        const [warmupOptions, setWarmupOptions] = useState(() => JSON.parse(localStorage.getItem('warmup_v11')) || ['Elongación', 'Postura', 'Saltabilidad', 'Equilibrio']);
        const [masterStudentList, setMasterStudentList] = useState(() => JSON.parse(localStorage.getItem('students_v11')) || []);
        const [apparatusMasterSkills, setApparatusMasterSkills] = useState(() => JSON.parse(localStorage.getItem('apparatusSkills_v11')) || {
            'Viga de equilibrio': ['Caminata', 'Giro', 'Salto de gato', 'Arabesque'],
            'Paralelas asimétricas': ['Suspensión', 'Salida', 'Dominada', 'Vuelo'],
            'Suelo': ['Rol adelante', 'Rueda', 'Vertical', 'Mortero'],
            'Salto': ['Mortero', 'Rondo', 'Media Luna', 'Pasaje']
        });

        useEffect(() => {
          localStorage.setItem('coaches_v11', JSON.stringify(coaches));
          localStorage.setItem('warmup_v11', JSON.stringify(warmupOptions));
          localStorage.setItem('students_v11', JSON.stringify(masterStudentList));
          localStorage.setItem('apparatusSkills_v11', JSON.stringify(apparatusMasterSkills));
        }, [coaches, warmupOptions, masterStudentList, apparatusMasterSkills]);

        const getInitialRecordState = () => ({
          date: new Date().toISOString().split('T')[0],
          groupName: '', selectedCoach: '', selectedDays: [],
          startTime: '17:00', endTime: '18:30',
          ageGroups: [],
          attendance: masterStudentList.map(s => ({ ...s, present: false })),
          warmupSkills: [], apparatus: [], 
          apparatusDetails: { 'Viga de equilibrio': [], 'Paralelas asimétricas': [], 'Suelo': [], 'Salto': [] }
        });

        const [record, setRecord] = useState(getInitialRecordState);

        useEffect(() => {
          setRecord(prev => ({
            ...prev,
            attendance: masterStudentList.map(s => {
              const existing = prev.attendance.find(a => a.dni === s.dni);
              return { ...s, present: existing ? existing.present : false };
            })
          }));
        }, [masterStudentList]);

        const resetForm = () => {
          setRecord(getInitialRecordState());
          setCurrentStep(Step.MainInfo);
          setViewMode('Registro');
        };

        const handleToggle = (item, field) => {
          setRecord(prev => {
            const currentList = prev[field];
            const newList = currentList.includes(item) ? currentList.filter(i => i !== item) : [...currentList, item];
            return {...prev, [field]: newList};
          });
        };

        const handleApparatusSkillToggle = (apparatus, skill) => {
            setRecord(prev => {
                const details = { ...prev.apparatusDetails };
                const currentSkills = details[apparatus] || [];
                details[apparatus] = currentSkills.includes(skill) 
                    ? currentSkills.filter(s => s !== skill) 
                    : [...currentSkills, skill];
                return { ...prev, apparatusDetails: details };
            });
        };

        const addMasterSkill = (apparatus) => {
            const s = prompt(`Nueva habilidad para ${apparatus}:`);
            if (s) {
                setApparatusMasterSkills(prev => ({
                    ...prev,
                    [apparatus]: [...new Set([...(prev[apparatus] || []), s])]
                }));
            }
        };

        const handleSave = () => {
          setIsSaving(true);
          const presentList = record.attendance.filter(a => a.present).map(a => a.name);
          const fullRecord = { ...record, presentList, timestamp: Date.now() };
          
          if (typeof google !== 'undefined' && google.script?.run) {
            google.script.run.withSuccessHandler(() => {
              setIsSaving(false);
              setCurrentStep(Step.Success);
            }).saveClassData(JSON.stringify(fullRecord));
          } else {
            setTimeout(() => { 
                setHistory(prev => [...prev, fullRecord]);
                setIsSaving(false); 
                setCurrentStep(Step.Success); 
            }, 1000);
          }
        };

        // --- VALIDACIONES DE NAVEGACIÓN ---
        const canGoToAttendance = record.ageGroups.length > 0;
        const canGoToWarmup = record.attendance.some(a => a.present);

        return (
          <div className="min-h-screen flex flex-col items-center p-4 md:p-8 bg-slate-50">
            <div className="w-full max-w-lg mb-8 text-center space-y-4">
              <h1 className="text-4xl font-black uppercase italic tracking-tighter text-indigo-900 leading-none">GymCoach Pro</h1>
              <p className="text-slate-400 text-[10px] font-bold tracking-[0.4em] uppercase">Elite Pedagogy v11.0</p>
              
              <nav className="glass-card rounded-[2.5rem] p-1.5 shadow-xl flex border-white border mt-4">
                <button onClick={() => setViewMode('Registro')} className={`flex-1 py-4 rounded-[2rem] text-[12px] font-black tracking-widest transition-all duration-300 ${viewMode === 'Registro' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-indigo-600'}`}>REGISTRO</button>
                <button onClick={() => setViewMode('Estadisticas')} className={`flex-1 py-4 rounded-[2rem] text-[12px] font-black tracking-widest transition-all duration-300 ${viewMode === 'Estadisticas' ? 'bg-indigo-600 text-white shadow-lg' : 'text-slate-400 hover:text-indigo-600'}`}>BIO-REPORTE</button>
              </nav>
            </div>

            <div className="w-full max-w-lg bg-white rounded-[3.5rem] shadow-2xl overflow-hidden border border-white relative min-h-[750px]">
              {viewMode === 'Registro' && (
                <div className="absolute top-0 left-0 w-full flex gap-1 p-2">
                  {[...Array(8)].map((_, i) => (
                    <div key={i} className={`h-1.5 flex-1 rounded-full transition-all duration-500 ${i <= currentStep ? 'bg-indigo-500' : 'bg-slate-100'}`}></div>
                  ))}
                </div>
              )}

              <main className="p-8 md:p-12 pt-16">
                {viewMode === 'Registro' ? (
                  <div className="animate-fadeIn space-y-10">
                    
                    {/* PASO 0: INFO PRINCIPAL */}
                    {currentStep === Step.MainInfo && (
                      <div className="space-y-10">
                        <div className="flex justify-between items-center">
                            <h2 className="text-2xl font-black text-slate-800 uppercase italic">01. Configuración</h2>
                            <span className="text-[10px] font-bold bg-indigo-50 text-indigo-600 px-3 py-1 rounded-full">{record.date}</span>
                        </div>
                        <div className="space-y-8">
                          <div>
                            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2 px-4 italic">Grupo</label>
                            <input type="text" placeholder="Ej: Elite A" className="w-full p-6 bg-slate-50 rounded-[2rem] font-black text-slate-800 border-2 border-transparent focus:bg-white text-xl" value={record.groupName} onChange={e => setRecord({...record, groupName: e.target.value})} />
                          </div>
                          <div className="space-y-4">
                            <div className="flex items-center justify-between px-4">
                              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Docente</label>
                              <button onClick={() => { const n = prompt("Nombre:"); if(n) setCoaches([...coaches, n]); }} className="w-8 h-8 rounded-full bg-indigo-600 text-white shadow-lg flex items-center justify-center"><i className="fas fa-plus"></i></button>
                            </div>
                            <div className="flex flex-wrap gap-2">
                              {coaches.map((c, i) => (
                                <EditableBadge 
                                  key={i} value={c} isSelected={record.selectedCoach === c}
                                  onSelect={() => setRecord({...record, selectedCoach: c})}
                                  onUpdate={(val) => setCoaches(coaches.map((x, idx) => idx === i ? val : x))}
                                  onDelete={() => setCoaches(coaches.filter((_, idx) => idx !== i))}
                                />
                              ))}
                            </div>
                          </div>
                        </div>
                        <button disabled={!record.groupName || !record.selectedCoach} onClick={() => setCurrentStep(Step.AgeGroup)} className="w-full py-6 bg-indigo-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">Siguiente</button>
                      </div>
                    )}

                    {/* PASO 1: CATEGORÍAS */}
                    {currentStep === Step.AgeGroup && (
                        <div className="space-y-10 animate-fadeIn">
                            <h2 className="text-2xl font-black text-slate-800 uppercase italic">02. Categorías</h2>
                            <div className="grid grid-cols-1 gap-4">
                                {AGE_GROUPS_LIST.map(group => (
                                    <button key={group} onClick={() => handleToggle(group, 'ageGroups')} className={`p-8 rounded-[2.5rem] border-2 transition-all flex items-center justify-between group ${record.ageGroups.includes(group) ? 'bg-indigo-600 text-white border-indigo-600 shadow-xl' : 'bg-white text-slate-400 border-slate-100 hover:border-indigo-200'}`}>
                                        <span className="text-lg font-black uppercase italic tracking-widest">{group}</span>
                                        <div className={`w-8 h-8 rounded-full border-2 flex items-center justify-center ${record.ageGroups.includes(group) ? 'border-white bg-white/20' : 'border-slate-100'}`}>
                                            {record.ageGroups.includes(group) && <i className="fas fa-check"></i>}
                                        </div>
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setCurrentStep(Step.MainInfo)} className="flex-1 py-6 text-slate-400 font-black text-[12px] uppercase">Atrás</button>
                                <button disabled={!canGoToAttendance} onClick={() => setCurrentStep(Step.Attendance)} className="flex-[2] py-6 bg-indigo-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">
                                    {canGoToAttendance ? 'Asistencia' : 'Elige Categoría'}
                                </button>
                            </div>
                        </div>
                    )}

                    {/* PASO 2: ASISTENCIA */}
                    {currentStep === Step.Attendance && (
                      <div className="space-y-8 animate-fadeIn">
                        <div className="flex items-center justify-between">
                            <h2 className="text-2xl font-black text-slate-800 uppercase italic">03. Asistencia</h2>
                            {!canGoToWarmup && <span className="text-[10px] font-bold text-red-500 uppercase tracking-widest bg-red-50 px-3 py-1 rounded-full animate-pulse">Marca al menos 1 alumno</span>}
                        </div>
                        <div className="space-y-4 max-h-[450px] overflow-y-auto custom-scrollbar pr-2">
                          {record.attendance.length === 0 ? (
                              <div className="text-center py-10">
                                  <p className="text-slate-400 font-bold italic mb-4">No hay alumnos en el directorio.</p>
                                  <button onClick={() => setViewMode('Estadisticas')} className="text-indigo-600 font-black text-xs uppercase underline">Añadir Alumnos</button>
                              </div>
                          ) : record.attendance.map((student, idx) => (
                            <div key={student.dni} onClick={() => { const n = [...record.attendance]; n[idx].present = !n[idx].present; setRecord({...record, attendance: n}); }} className={`p-6 rounded-[2.5rem] border-2 cursor-pointer transition-all ${student.present ? 'bg-emerald-50 border-emerald-500 shadow-md' : 'bg-white border-slate-100'}`}>
                              <div className="flex items-center justify-between">
                                <span className="font-black text-lg">{student.name}</span>
                                <div className={`circle-check ${student.present ? 'active' : ''}`}>{student.present && <i className="fas fa-check text-white"></i>}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setCurrentStep(Step.AgeGroup)} className="flex-1 py-6 text-slate-400 font-black text-[12px] uppercase">Atrás</button>
                            <button disabled={!canGoToWarmup} onClick={() => setCurrentStep(Step.Warmup)} className="flex-[2] py-6 bg-indigo-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">
                                {canGoToWarmup ? 'Calentamiento' : 'Sin Alumnos Presentes'}
                            </button>
                        </div>
                      </div>
                    )}

                    {/* PASO 3: CALENTAMIENTO */}
                    {currentStep === Step.Warmup && (
                        <div className="space-y-8 animate-fadeIn">
                            <div className="flex items-center justify-between">
                                <h2 className="text-2xl font-black text-slate-800 uppercase italic">04. Calentamiento</h2>
                                <button onClick={() => { const s = prompt("Ejercicio:"); if(s) setWarmupOptions([...warmupOptions, s]); }} className="w-8 h-8 rounded-full bg-amber-500 text-white shadow-lg flex items-center justify-center"><i className="fas fa-plus"></i></button>
                            </div>
                            <div className="flex flex-wrap gap-3">
                                {warmupOptions.map((skill, i) => (
                                    <EditableBadge 
                                        key={i} value={skill} isSelected={record.warmupSkills.includes(skill)}
                                        onSelect={() => handleToggle(skill, 'warmupSkills')}
                                        onUpdate={(val) => setWarmupOptions(warmupOptions.map((x, idx) => idx === i ? val : x))}
                                        onDelete={() => setWarmupOptions(warmupOptions.filter((_, idx) => idx !== i))}
                                        colorClass="amber"
                                    />
                                ))}
                            </div>
                            <div className="flex gap-4 mt-8">
                                <button onClick={() => setCurrentStep(Step.Attendance)} className="flex-1 py-6 text-slate-400 font-black text-[12px] uppercase">Atrás</button>
                                <button onClick={() => setCurrentStep(Step.ApparatusSelect)} className="flex-[2] py-6 bg-indigo-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">Aparatos</button>
                            </div>
                        </div>
                    )}

                    {/* PASO 4: SELECCIÓN APARATOS */}
                    {currentStep === Step.ApparatusSelect && (
                        <div className="space-y-8 animate-fadeIn">
                            <h2 className="text-2xl font-black text-slate-800 uppercase italic">05. Aparatos</h2>
                            <div className="grid grid-cols-2 gap-6">
                                {APPARATUS_OPTIONS.map(ap => (
                                    <button key={ap} onClick={() => handleToggle(ap, 'apparatus')} className={`aspect-square rounded-[3rem] border-4 flex flex-col items-center justify-center p-6 transition-all ${record.apparatus.includes(ap) ? 'bg-indigo-600 border-indigo-400 text-white shadow-xl scale-105' : 'bg-white border-slate-50 text-slate-300'}`}>
                                        {ap === 'Paralelas asimétricas' ? <UnevenBarsIcon active={record.apparatus.includes(ap)} /> : <i className={`fas ${ap === 'Suelo' ? 'fa-vector-square' : ap === 'Salto' ? 'fa-bolt' : 'fa-grip-lines-vertical'} text-4xl mb-4`}></i>}
                                        <span className="text-[10px] font-black uppercase text-center mt-2">{ap}</span>
                                    </button>
                                ))}
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setCurrentStep(Step.Warmup)} className="flex-1 py-6 text-slate-400 font-black text-[12px] uppercase">Atrás</button>
                                <button disabled={record.apparatus.length === 0} onClick={() => setCurrentStep(Step.ApparatusDetail)} className="flex-[2] py-6 bg-indigo-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">Detalles</button>
                            </div>
                        </div>
                    )}

                    {/* PASO 5: DETALLES */}
                    {currentStep === Step.ApparatusDetail && (
                        <div className="space-y-10 animate-fadeIn">
                            <h2 className="text-2xl font-black text-slate-800 uppercase italic">06. Ejecución</h2>
                            <div className="space-y-12">
                                {record.apparatus.map(ap => (
                                    <div key={ap} className="space-y-4">
                                        <div className="flex items-center justify-between border-b-2 border-slate-100 pb-2">
                                            <h3 className="font-black text-indigo-900 uppercase italic text-sm">{ap}</h3>
                                            <button onClick={() => addMasterSkill(ap)} className="text-[10px] font-black uppercase text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">+ Añadir Habilidad</button>
                                        </div>
                                        <div className="flex flex-wrap gap-2">
                                            {apparatusMasterSkills[ap]?.map((skill, i) => (
                                                <EditableBadge 
                                                    key={i} value={skill} isSelected={record.apparatusDetails[ap]?.includes(skill)}
                                                    onSelect={() => handleApparatusSkillToggle(ap, skill)}
                                                    onUpdate={(val) => setApparatusMasterSkills(prev => ({...prev, [ap]: prev[ap].map((x, idx) => idx === i ? val : x)}))}
                                                    onDelete={() => setApparatusMasterSkills(prev => ({...prev, [ap]: prev[ap].filter((_, idx) => idx !== i)}))}
                                                    colorClass="indigo"
                                                />
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <div className="flex gap-4 mt-12">
                                <button onClick={() => setCurrentStep(Step.ApparatusSelect)} className="flex-1 py-6 text-slate-400 font-black text-[12px] uppercase">Atrás</button>
                                <button onClick={() => setCurrentStep(Step.Summary)} className="flex-[2] py-6 bg-indigo-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">Resumen</button>
                            </div>
                        </div>
                    )}

                    {/* PASO 6: RESUMEN */}
                    {currentStep === Step.Summary && (
                        <div className="space-y-8 animate-fadeIn">
                            <h2 className="text-2xl font-black text-slate-800 uppercase italic">07. Resumen</h2>
                            <div className="bg-slate-50 p-8 rounded-[3rem] space-y-6 border border-slate-100">
                                <div><p className="text-[10px] font-black text-slate-400 uppercase italic">Grupo / Docente</p><p className="font-black text-lg text-slate-800">{record.groupName} • {record.selectedCoach}</p></div>
                                <div><p className="text-[10px] font-black text-slate-400 uppercase italic">Fecha</p><p className="font-bold text-slate-600">{record.date}</p></div>
                                <div><p className="text-[10px] font-black text-slate-400 uppercase italic">Categorías</p><p className="font-bold text-slate-600">{record.ageGroups.join(', ')}</p></div>
                                <div><p className="text-[10px] font-black text-slate-400 uppercase italic">Presentes</p><p className="font-bold text-emerald-600">{record.attendance.filter(a => a.present).length} Alumnos</p></div>
                                <div><p className="text-[10px] font-black text-slate-400 uppercase italic">Aparatos</p><p className="font-bold text-indigo-600">{record.apparatus.join(', ')}</p></div>
                            </div>
                            <div className="flex gap-4">
                                <button onClick={() => setCurrentStep(Step.ApparatusDetail)} className="flex-1 py-6 text-slate-400 font-black text-[12px] uppercase">Atrás</button>
                                <button onClick={handleSave} className="flex-[2] py-6 bg-emerald-600 text-white rounded-[2rem] font-black uppercase text-sm shadow-xl">{isSaving ? 'Guardando...' : 'Confirmar y Guardar'}</button>
                            </div>
                        </div>
                    )}

                    {/* PASO FINAL: ÉXITO + REINICIO */}
                    {currentStep === Step.Success && (
                        <div className="text-center py-20 animate-fadeIn space-y-10">
                            <div className="w-32 h-32 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center text-6xl mx-auto shadow-inner"><i className="fas fa-check"></i></div>
                            <h2 className="text-3xl font-black text-slate-800 uppercase italic tracking-tighter leading-none">¡Sesión<br/>Guardada!</h2>
                            <div className="space-y-4 pt-10">
                                <button onClick={resetForm} className="w-full py-8 bg-indigo-600 text-white rounded-[2.5rem] font-black uppercase text-sm shadow-2xl active:scale-95 transition-all">Nueva Clase (Reiniciar)</button>
                                <button onClick={() => setViewMode('Estadisticas')} className="w-full py-6 text-slate-400 font-black uppercase text-xs">Ir a Reportes</button>
                            </div>
                        </div>
                    )}

                  </div>
                ) : (
                  /* VISTA REPORTE Y GESTIÓN DE ALUMNOS */
                  <div className="animate-fadeIn space-y-12">
                    <div className="bg-slate-900 p-12 rounded-[4rem] text-white shadow-2xl text-center relative overflow-hidden">
                       <p className="text-indigo-400 font-black uppercase text-[10px] tracking-[0.4em] mb-4">Registro Biométrico</p>
                       <p className="text-8xl font-black italic tracking-tighter leading-none mb-6">{history.length}</p>
                       <p className="text-white/40 font-bold uppercase text-[11px] tracking-widest">Sesiones hoy: {record.date}</p>
                    </div>
                    <div className="space-y-6">
                        <div className="flex items-center justify-between px-4">
                            <h3 className="font-black uppercase text-lg tracking-widest text-slate-800">Directorio</h3>
                            <button onClick={() => {
                                const n = prompt("Nombre:");
                                const d = prompt("DNI:");
                                const b = prompt("Fecha Nac (AAAA-MM-DD):");
                                if(n && d && b) setMasterStudentList([...masterStudentList, {name: n, dni: d, birthDate: b}]);
                            }} className="w-10 h-10 rounded-full bg-indigo-600 text-white shadow-md flex items-center justify-center"><i className="fas fa-plus"></i></button>
                        </div>
                        <div className="space-y-4">
                            {masterStudentList.length === 0 ? <p className="text-center py-10 text-slate-400 italic font-bold">Sin alumnos registrados.</p> : masterStudentList.map(student => (
                                <div key={student.dni} className="glass-card p-6 rounded-[2.5rem] flex items-center justify-between border border-slate-100 shadow-sm group">
                                    <div className="flex items-center gap-5">
                                        <div className="w-14 h-14 bg-indigo-900 text-white rounded-full flex items-center justify-center font-black text-xl">{student.name.charAt(0)}</div>
                                        <div>
                                            <p className="font-black text-lg text-slate-800 leading-none">{student.name}</p>
                                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-2">{student.dni}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setMasterStudentList(masterStudentList.filter(s => s.dni !== student.dni))} className="trash-btn w-10 h-10 rounded-full bg-red-50 text-red-500 flex items-center justify-center"><i className="fas fa-trash"></i></button>
                                </div>
                            ))}
                        </div>
                    </div>
                  </div>
                )}
              </main>
            </div>
            
            <footer className="mt-16 text-[11px] text-slate-400 font-black uppercase tracking-[0.6em] opacity-40 text-center leading-loose">
              GymCoach Elite v11.0 • Form Validation Active<br/>
              <span className="text-[9px] tracking-[0.2em] mt-2 block italic">Reset Engine • Safety Controls • Attendance Validation</span>
            </footer>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
</body>
</html>
