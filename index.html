<!DOCTYPE html>
<html class="dark" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>GymCoach Pro - Antigravity Dashboard</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#00f2ff", // Neon Cyan
              "background-light": "#f8fafc",
              "background-dark": "#0a0e14",
              "card-dark": "#161b22",
              "accent-purple": "#6366f1",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "16px",
            },
            boxShadow: {
              'neon-cyan': '0 0 10px rgba(0, 242, 255, 0.4)',
              'neon-cyan-strong': '0 0 15px rgba(0, 242, 255, 0.8)',
            }
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
            .gradient-header {
                background: linear-gradient(135deg, #1e3a8a 0%, #6366f1 100%);
            }
            .neon-border {
                border: 1px solid #00f2ff;
                box-shadow: 0 0 8px rgba(0, 242, 255, 0.3);
            }
            .active-glow {
                filter: drop-shadow(0 0 5px #00f2ff);
            }
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
        }
        .page-transition { 
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .auth-bg {
            background: radial-gradient(circle at top right, #1e3a8a, #6366f1, #0a0e14);
            min-height: 100vh;
        }
    </style>
    <script>
        window.process = {
            env: { API_KEY: "" },
            browser: true,
            version: ''
        };
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "dexie": "https://esm.sh/dexie@^4.3.0",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
      }
    }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
