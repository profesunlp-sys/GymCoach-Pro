<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>GymCoach Pro - Antigravity Suite</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lexend:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#007AFF", // iOS Blue
              secondary: "#8E8E93", // iOS Gray
              "antigravity-black": "#1C1C1E", // iOS Dark Text
              "antigravity-charcoal": "#F2F2F7", // iOS Light Background
              "neon-cyan": "#007AFF",
              "neon-blue": "#007AFF",
              "accent-purple": "#AF52DE", // iOS Purple
              "background-dark": "#F2F2F7",
              "ios-gray": "#F2F2F7",
              "ios-blue": "#007AFF",
              "ios-green": "#34C759",
              "ios-orange": "#FF9500",
              "ios-red": "#FF3B30",
            },
            fontFamily: {
              display: ["Inter", "Lexend", "sans-serif"],
              sans: ["Inter", "sans-serif"],
            },
            boxShadow: {
              'ios': '0 2px 12px rgba(0, 0, 0, 0.08)',
              'neon-cyan': '0 0 10px rgba(0, 122, 255, 0.2)',
              'neon-purple': '0 0 10px rgba(175, 82, 222, 0.2)',
              'neon-fab-blue': '0 4px 14px rgba(0, 122, 255, 0.4)',
            }
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .glass-card {
                background: rgba(255, 255, 255, 0.95);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(0, 0, 0, 0.05);
                box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            }
            .auth-bg {
                background: radial-gradient(circle at 50% 40%, #111118 0%, #0a0a0b 60%, #000000 100%);
            }
            .gradient-header {
                background: linear-gradient(180deg, #FFFFFF 0%, #F2F2F7 100%);
            }
            .neon-border {
                border: 1.5px solid #007AFF;
                box-shadow: 0 0 8px rgba(0, 122, 255, 0.2);
            }
            .neon-border-cyan {
                box-shadow: 0 0 5px rgba(0, 122, 255, 0.1);
            }
            .neon-fab-blue {
                box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            }
            .active-glow {
                filter: drop-shadow(0 0 2px #007AFF);
            }
            .neon-glow-cyan {
                text-shadow: none;
                color: #007AFF;
            }
            .ios-toggle:checked + .ios-toggle-label {
                background-color: #34C759;
            }
            .ios-toggle:checked + .ios-toggle-label::after {
                transform: translateX(20px);
                background-color: #FFFFFF;
            }
            .crafted-input {
                @apply bg-white border border-black/10 rounded-2xl px-5 py-4 text-sm text-black transition-all outline-none placeholder:text-black/40;
            }
            .crafted-input:focus {
                @apply border-primary ring-1 ring-primary/30;
            }
            .title-antigravity {
                @apply font-black uppercase tracking-tighter text-black;
            }
            .btn-primary {
                @apply bg-primary text-white font-black uppercase tracking-widest px-6 py-3 rounded-2xl shadow-ios active:scale-95 transition-all flex items-center justify-center gap-2;
            }
            .btn-secondary {
                @apply bg-white border border-black/5 text-black font-bold uppercase tracking-wider px-6 py-3 rounded-2xl hover:bg-black/5 active:scale-95 transition-all flex items-center justify-center gap-2;
            }
            .focus-mode-active {
                @apply fixed inset-0 z-[200] bg-ios-gray overflow-y-auto p-6 md:p-12;
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .custom-scrollbar::-webkit-scrollbar {
              width: 4px;
            }
            .custom-scrollbar::-webkit-scrollbar-track {
              background: rgba(0, 0, 0, 0.05);
              border-radius: 10px;
            }
            .custom-scrollbar::-webkit-scrollbar-thumb {
              background: #007AFF;
              border-radius: 10px;
            }
            .alert-icon {
                @apply w-8 h-8 rounded-full flex items-center justify-center shadow-sm;
            }
            .alert-icon-danger {
                @apply bg-ios-red/10 text-ios-red border border-ios-red/20;
            }
            .alert-icon-warning {
                @apply bg-ios-orange/10 text-ios-orange border border-ios-orange/20;
            }
            .alert-icon-info {
                @apply bg-ios-blue/10 text-ios-blue border border-ios-blue/20;
            }
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #F2F2F7;
            color: #1C1C1E;
        }
        .page-transition { 
            animation: slideUp 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
    <script>
        window.process = {
            env: { API_KEY: "" },
            browser: true,
            version: ''
        };
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react/": "https://esm.sh/react@^19.2.4/",
        "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "vite": "https://esm.sh/vite@^7.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
      }
    }
    </script>
</head>
<body class="bg-ios-gray">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
