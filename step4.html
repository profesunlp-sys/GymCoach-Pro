<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>GymCoach Pro - Apparatus Wizard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#277bf1",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col">
<!-- Header / Navigation Bar (iOS Style) -->
<header class="sticky top-0 z-50 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-800">
<div class="max-w-md mx-auto px-4 h-16 flex items-center justify-between">
<button class="flex items-center text-primary font-medium">
<span class="material-icons-round text-3xl">chevron_left</span>
<span class="text-lg">Atrás</span>
</button>
<h1 class="text-lg font-bold absolute left-1/2 -translate-x-1/2">Aparatos</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<main class="flex-1 max-w-md mx-auto w-full px-6 py-8">
<!-- Step Indicator -->
<div class="text-center mb-8">
<p class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Paso 4 de 6</p>
<div class="flex justify-center gap-1.5 mt-3">
<div class="h-1.5 w-6 rounded-full bg-primary/30"></div>
<div class="h-1.5 w-6 rounded-full bg-primary/30"></div>
<div class="h-1.5 w-6 rounded-full bg-primary/30"></div>
<div class="h-1.5 w-10 rounded-full bg-primary"></div>
<div class="h-1.5 w-6 rounded-full bg-slate-200 dark:bg-slate-700"></div>
<div class="h-1.5 w-6 rounded-full bg-slate-200 dark:bg-slate-700"></div>
</div>
</div>
<!-- Instructional Text -->
<div class="mb-8">
<h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Selecciona el equipo</h2>
<p class="text-slate-500 dark:text-slate-400">Elige los aparatos que se utilizarán en esta sesión de entrenamiento.</p>
</div>
<!-- Selection Grid 2x2 -->
<div class="grid grid-cols-2 gap-4">
<!-- Card: Viga (Unselected) -->
<button class="aspect-square bg-white dark:bg-slate-800 rounded-xl shadow-sm border-2 border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition-all flex flex-col items-center justify-center p-4 group">
<div class="w-16 h-16 mb-4 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-slate-200 dark:group-hover:bg-slate-600 transition-colors">
<span class="material-icons-round text-4xl text-slate-600 dark:text-slate-300">horizontal_rule</span>
</div>
<span class="font-semibold text-slate-700 dark:text-slate-200">Viga</span>
</button>
<!-- Card: Paralelas (Selected Example) -->
<button class="aspect-square bg-primary/10 dark:bg-primary/20 rounded-xl shadow-sm border-2 border-primary transition-all flex flex-col items-center justify-center p-4">
<div class="w-16 h-16 mb-4 flex items-center justify-center rounded-full bg-primary text-white">
<span class="material-icons-round text-4xl">reorder</span>
</div>
<span class="font-bold text-primary">Paralelas</span>
</button>
<!-- Card: Suelo (Unselected) -->
<button class="aspect-square bg-white dark:bg-slate-800 rounded-xl shadow-sm border-2 border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition-all flex flex-col items-center justify-center p-4 group">
<div class="w-16 h-16 mb-4 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-slate-200 dark:group-hover:bg-slate-600 transition-colors">
<span class="material-icons-round text-4xl text-slate-600 dark:text-slate-300">grid_view</span>
</div>
<span class="font-semibold text-slate-700 dark:text-slate-200">Suelo</span>
</button>
<!-- Card: Salto (Unselected) -->
<button class="aspect-square bg-white dark:bg-slate-800 rounded-xl shadow-sm border-2 border-transparent hover:border-slate-200 dark:hover:border-slate-700 transition-all flex flex-col items-center justify-center p-4 group">
<div class="w-16 h-16 mb-4 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 group-hover:bg-slate-200 dark:group-hover:bg-slate-600 transition-colors">
<span class="material-icons-round text-4xl text-slate-600 dark:text-slate-300">trending_up</span>
</div>
<span class="font-semibold text-slate-700 dark:text-slate-200">Salto</span>
</button>
</div>
<!-- Decorative Illustration Placeholder -->
<div class="mt-12 flex justify-center">
<div class="relative w-full max-w-[240px] aspect-video rounded-xl overflow-hidden bg-slate-200 dark:bg-slate-800">
<img class="w-full h-full object-cover opacity-60 dark:opacity-40 grayscale" data-alt="Gymnastics equipment in a professional training facility" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCuQDk0--ygVeDm2H4-QsLZa4NCSiTf-mDijT4a0yQSf2KB2mkoY1KSsTbZGTmqLg-nTL0t3nkezoNvY2S6CprUVpf3fjCfm3LRMxP49X2lovBpFJ49qiB73CKvZ-pauEDebgVGQMSOf3FIYL01nnrsDHEK54gWib4yLcsZZiuScU0un8oPmNgRiPgudQAcooTBgBPNMpHlQtMjJZhF1RVTEaDp3UOxEa6TGUlmrauObKZXomqKFzzA8zNFTBXKCVQEVFyzVRx51ptY"/>
<div class="absolute inset-0 bg-gradient-to-t from-background-light dark:from-background-dark to-transparent"></div>
</div>
</div>
</main>
<!-- Footer Navigation (iOS Fixed Bottom) -->
<footer class="sticky bottom-0 bg-white/90 dark:bg-background-dark/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 safe-area-bottom">
<div class="max-w-md mx-auto px-6 py-5 flex items-center gap-4">
<button class="flex-1 py-4 px-6 rounded-xl font-bold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors active:scale-95">
                Atrás
            </button>
<button class="flex-[2] py-4 px-6 rounded-xl font-bold text-white bg-primary hover:brightness-110 shadow-lg shadow-primary/25 transition-all active:scale-95">
                Siguiente
            </button>
</div>
</footer>
</body></html>
