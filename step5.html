<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#277bf1",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101722",
                    },
                    fontFamily: {
                        "display": ["Lexend"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-tap-highlight-color: transparent;
        }
        .ios-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200 min-h-screen flex items-center justify-center p-0 md:p-4">
<!-- Mobile Container (iPhone Pro Max simulation for Desktop) -->
<div class="w-full max-w-[430px] min-h-[932px] bg-white dark:bg-slate-900 shadow-2xl overflow-hidden relative flex flex-col md:rounded-[3rem] md:border-[8px] md:border-slate-800">
<!-- Status Bar Area (iOS Style) -->
<div class="h-12 flex justify-between items-center px-8 pt-4">
<span class="text-sm font-semibold">9:41</span>
<div class="flex gap-1.5 items-center">
<span class="material-icons text-xs">signal_cellular_alt</span>
<span class="material-icons text-xs">wifi</span>
<span class="material-icons text-xs">battery_full</span>
</div>
</div>
<!-- Header Navigation -->
<header class="px-6 pt-4 pb-2 flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-icons text-slate-600 dark:text-slate-300">arrow_back_ios_new</span>
</button>
<h1 class="text-xl font-bold text-slate-900 dark:text-white">Viga</h1>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-6 pt-2 pb-32">
<!-- Step Indicator -->
<div class="mb-8">
<div class="flex justify-between items-center mb-2">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400">Paso 5 de 6</span>
<span class="text-xs font-bold text-primary">83%</span>
</div>
<div class="h-1.5 w-full bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary w-[83%] rounded-full"></div>
</div>
</div>
<!-- Skills Cloud Section -->
<section class="mb-8">
<h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-300">Habilidades Sugeridas</h2>
<div class="flex flex-wrap gap-3">
<!-- Selected Chips -->
<button class="px-5 py-2.5 bg-primary text-white rounded-full text-sm font-medium ios-shadow flex items-center gap-2">
                        Caminar <span class="material-icons text-xs">check</span>
</button>
<button class="px-5 py-2.5 bg-primary text-white rounded-full text-sm font-medium ios-shadow flex items-center gap-2">
                        Media Luna <span class="material-icons text-xs">check</span>
</button>
<!-- Unselected Chips -->
<button class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        Salto Extendido
                    </button>
<button class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        Flic Flac
                    </button>
<button class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 rounded-full text-sm font-medium hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        Rondo
                    </button>
</div>
</section>
<!-- Custom Input -->
<section class="mb-10">
<label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-2" for="custom-skill">¿No encuentras lo que buscas?</label>
<div class="relative group">
<input class="w-full h-14 pl-5 pr-14 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-slate-400" id="custom-skill" placeholder="Otra habilidad..." type="text"/>
<button class="absolute right-2 top-2 bottom-2 w-10 h-10 bg-primary text-white rounded-lg flex items-center justify-center shadow-lg hover:shadow-primary/30 transition-shadow">
<span class="material-icons">add</span>
</button>
</div>
</section>
<!-- Summary Section -->
<section class="p-5 bg-slate-50 dark:bg-slate-800/50 rounded-2xl border border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-2 mb-4">
<span class="material-icons text-primary text-lg">list_alt</span>
<h2 class="text-base font-bold text-slate-800 dark:text-white">Seleccionados (2)</h2>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-lg shadow-sm">
<span class="text-sm font-medium">Caminar</span>
<button class="text-slate-400 hover:text-red-500">
<span class="material-icons text-sm">close</span>
</button>
</div>
<div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-lg shadow-sm">
<span class="text-sm font-medium">Media Luna</span>
<button class="text-slate-400 hover:text-red-500">
<span class="material-icons text-sm">close</span>
</button>
</div>
</div>
</section>
</main>
<!-- Bottom Navigation -->
<footer class="absolute bottom-0 left-0 right-0 p-6 pb-10 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-t border-slate-100 dark:border-slate-800 flex gap-4">
<button class="flex-1 py-4 px-6 border-2 border-slate-200 dark:border-slate-700 rounded-xl font-bold text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-800 transition-colors">
                Atrás
            </button>
<button class="flex-[2] py-4 px-6 bg-primary text-white rounded-xl font-bold shadow-xl shadow-primary/25 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Siguiente
                <span class="material-icons text-sm">arrow_forward</span>
</button>
</footer>
<!-- iOS Home Indicator -->
<div class="absolute bottom-2 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-slate-300 dark:bg-slate-700 rounded-full"></div>
</div>
</body></html>
