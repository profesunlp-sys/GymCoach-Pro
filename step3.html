<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GymCoach Pro - Warmup Wizard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#277bf1",
                "background-light": "#f6f7f8",
                "background-dark": "#101722",
              },
              fontFamily: {
                "display": ["Lexend"]
              },
              borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<!-- iOS Status Bar Spacer (Simulated) -->
<div class="h-12 w-full bg-white dark:bg-slate-900"></div>
<!-- Header Navigation -->
<header class="bg-white dark:bg-slate-900 px-4 py-4 border-b border-slate-200 dark:border-slate-800 sticky top-0 z-10">
<div class="flex items-center justify-between">
<button class="text-primary flex items-center gap-1 focus:outline-none">
<span class="material-icons">arrow_back_ios</span>
<span class="text-lg">Atrás</span>
</button>
<h1 class="text-xl font-bold text-slate-800 dark:text-white absolute left-1/2 -translate-x-1/2">Entrada en Calor</h1>
<div class="w-10"></div> <!-- Spacer for balance -->
</div>
</header>
<!-- Main Content Area -->
<main class="flex-grow p-5 max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="mb-8">
<div class="flex justify-between items-end mb-2">
<span class="text-sm font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Configuración de Clase</span>
<span class="text-sm font-bold text-primary">Paso 3 de 6</span>
</div>
<div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
<div class="bg-primary h-full w-1/2 rounded-full"></div>
</div>
</div>
<section>
<h2 class="text-2xl font-semibold text-slate-800 dark:text-white mb-2">Objetivos del Calentamiento</h2>
<p class="text-slate-500 dark:text-slate-400 mb-6">Selecciona las habilidades y áreas de enfoque que trabajarás hoy.</p>
<!-- Skills Selection Grid -->
<div class="grid grid-cols-2 gap-3 mb-8">
<!-- Selected Item -->
<button class="flex items-center justify-center p-4 bg-primary text-white rounded-xl shadow-md transition-all active:scale-95 border-2 border-primary">
<div class="flex flex-col items-center gap-2">
<span class="material-icons">accessibility_new</span>
<span class="font-medium">Elongación</span>
</div>
</button>
<!-- Unselected Item -->
<button class="flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl transition-all active:scale-95 border-2 border-transparent">
<div class="flex flex-col items-center gap-2">
<span class="material-icons">accessibility</span>
<span class="font-medium">Postura</span>
</div>
</button>
<!-- Unselected Item -->
<button class="flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl transition-all active:scale-95 border-2 border-transparent">
<div class="flex flex-col items-center gap-2">
<span class="material-icons">bolt</span>
<span class="font-medium">Saltabilidad</span>
</div>
</button>
<!-- Selected Item -->
<button class="flex items-center justify-center p-4 bg-primary text-white rounded-xl shadow-md transition-all active:scale-95 border-2 border-primary">
<div class="flex flex-col items-center gap-2">
<span class="material-icons">balance</span>
<span class="font-medium">Equilibrio</span>
</div>
</button>
<!-- Unselected Item -->
<button class="flex items-center justify-center p-4 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-xl transition-all active:scale-95 border-2 border-transparent">
<div class="flex flex-col items-center gap-2">
<span class="material-icons">fitness_center</span>
<span class="font-medium text-center leading-tight">Fuerza Abdominal</span>
</div>
</button>
<!-- Placeholder for dynamic feel -->
<div class="flex items-center justify-center p-4 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl opacity-50">
<span class="material-icons text-slate-400">add_circle_outline</span>
</div>
</div>
<!-- Custom Input Field -->
<div class="space-y-3">
<label class="text-sm font-semibold text-slate-600 dark:text-slate-400 ml-1">¿Falta algo?</label>
<div class="flex gap-2">
<div class="relative flex-grow">
<input class="w-full bg-white dark:bg-slate-800 border-slate-300 dark:border-slate-700 rounded-lg py-3 px-4 focus:ring-primary focus:border-primary text-slate-800 dark:text-white transition-colors" placeholder="Agregar otro objetivo..." type="text"/>
</div>
<button class="bg-primary text-white w-12 h-12 flex items-center justify-center rounded-lg shadow-lg shadow-primary/30 active:scale-95 transition-transform">
<span class="material-icons">add</span>
</button>
</div>
</div>
</section>
<!-- Illustration / Mood Image (Visual Polish) -->
<div class="mt-12 rounded-xl overflow-hidden relative h-32 bg-primary/10 border border-primary/20 flex items-center px-6">
<div class="z-10 flex flex-col">
<span class="text-primary font-bold text-lg">Tip del Coach</span>
<p class="text-slate-600 dark:text-slate-400 text-xs max-w-[200px]">Incluir movilidad articular ayuda a prevenir lesiones en las muñecas.</p>
</div>
<img class="absolute right-0 top-0 h-full w-32 object-cover opacity-20 dark:opacity-40 mask-image-gradient" data-alt="Gymnastics coach stretching athlete wrist" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBSQ0-Y6tfbMuLZrtaE9khFTokfq5VT0twpp5MSx5iJJyt3mWHuZl8rpZL2eLn9n93z5wFKnvrA7_F4y4El9am2CJesBLp9mhacmQ2ZcDnDh9r21pzoXO9dgPi6jKujim5XpQWjD6YLxY1ZiCkBH3e8k2F2n6P_B20mdUXnNAk9IRRreAzpmCXvt8GAXLktAAv3F_5MyN-RWSir0KvXzllB1Oo4LQmyCgiekVMXDZKZj_GUfBkMQQXddxohBFWarkPEuQCVE1YSivSY" style="mask-image: linear-gradient(to left, black 60%, transparent);"/>
</div>
</main>
<!-- Bottom Navigation Actions -->
<footer class="p-6 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 pb-10">
<div class="flex gap-4 max-w-md mx-auto">
<button class="flex-1 py-4 px-6 rounded-xl font-semibold text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-800 active:bg-slate-200 dark:active:bg-slate-700 transition-colors">
                Atrás
            </button>
<button class="flex-[2] py-4 px-6 rounded-xl font-semibold text-white bg-primary shadow-xl shadow-primary/25 active:bg-blue-700 transition-colors flex items-center justify-center gap-2">
<span>Siguiente</span>
<span class="material-icons text-sm">arrow_forward</span>
</button>
</div>
</footer>
<!-- iOS Home Indicator (Simulated) -->
<div class="h-1.5 w-32 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mb-2"></div>
</body></html>
